[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["DRAM and reserved-memory nodes of the stock device tree; the apps SMMU at 0x15000000."]
configuration = ["dts/fuxi.dts includes sm8550.dtsi and sets model and compatible; package/SmmuBypass.h is the UniXNU-sheng pass-through stream helper the touch probe uses for stream 0xa3."]
procedure = ["Fill the memory map from the stock device tree and the firmware's memory map."]
findings = ["package/ufs/SmmuTakeover.h is part of the vendored ShengUfs driver sources (see storage); it matches this area's package/*Smmu* path by name only and brings no memory or SMMU change.", "fuxi and sheng share the touch engine's SMMU stream (0xa3).", "The kernel at 65c4f4e had no CONFIG_XNU_DT_PANIC_REGION, so PE_create_console (check_for_panic_log, xnu d8b80295 pexpert/arm/pe_init.c) mapped BCM2837's PLATFORM_PANIC_LOG_PADDR 0x3C0FC000 write-combined, read a word there and called bzero for 16 KiB, before initialize_screen (disassembly of the CI kernel). No RAM range in /proc/iomem and no node of the live device tree covers that address; the nearest nodes are the NSP interconnect at 0x320C0000 and the CDSP at 0x32300000. Three boots ran this code on 2026-11-02 (probes a2-console and b11-createcons, and the official image); after each of them the phone booted Android normally (checked after the third: boot completed, /data mounted). With CONFIG_XNU_DT_PANIC_REGION, the only kernel change, the boot reaches bsd_init (e901139), so this access stopped the earlier boots. Whether it faults, hangs or is ignored was not measured.", "At the touch probe's panic the kernel manages 0x127068 pages (4.61 GiB) with 0x125ccd free (vm_page_pages, vm_page_free_count): the 4.75 GiB window minus the kernel image and boot data.", "This unit has 12 GB and its /memory node differs from the firmware map (from an 8 GB unit): in the map 0x8B9D00000 + 2 MiB and 0x8BBD00000 up to 0x8BD300000 are conventional memory, but on this phone they are not RAM. UniXNU-sheng records a synchronous external abort from touching such a range at 0x8BB300000, so these holes differ per unit. uefi-fuxi c5793bc2 removes them from the map (see firmware). The window DarwinBoot takes (0x8C007C000 + 0x130000000) is inside the /memory node of this phone. Live data: /proc/iomem and /sys/firmware/fdt read with root on OS4.0.0.32."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The DTS memory map is the SoC default."]
next_action = ["Account for the hand-off regions XNU maps against the firmware's reservations."]
evidence = [
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "With CONFIG_XNU_DT_PANIC_REGION the kernel passes PE_create_console and reaches bsd_init; vm_page_pages 0x127068 and vm_page_free_count 0x125ccd at the panic" },
  { kind = "device", command = "fastboot boot of image m1-touch (SHA-256 be38300f17d03ca1): uefi-fuxi c5793bc2, fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "Kernel on the corrected map: vm_page_pages 0x12705b and vm_page_free_count 0x125c40, the same as the third t4b-touch boot (old map, same arguments); no reset" },
]

[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/*ram-block*", "scripts/*virtio*", "scripts/*data-seed*", "package/NativeRamBlock.cpp", "package/*Disk.h", "package/PersistOverlay.h", "package/FuxiRamBlockStore.cpp", "package/ufs/**"]
inputs = ["UFS host of SM8550; the GPT of LUN 0 (userdata) on the device."]
configuration = ["CONFIG_XNU_NATIVE_UFS=y with the ShengUfs and VerifiedRoot components (board.toml), the component:ShengUfs kernel archive and native-ufs-root=1 in kernel_args: the catalog's ShengUfs (OddlyLabs/UniXNU fuxi branch, pin 99d8bcd, which carries the newest UFS change, the display bank TCR2 SEP fix of 2026-10-30; the upstream sheng tree moved its own pointer to af14068 on 2026-11-04, a delta of two Wi-Fi commits only) reads the SHNGROOT manifest at the start of userdata and publishes its OS and SystemOS windows read-only, as on sheng. CONFIG_XNU_VERIFIED_ROOT_PROBE=y, CONFIG_XNU_OWNER_ROOT_AUDIT=y, CONFIG_XNU_OWNER_ROOT_TRUST=y and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE follow UniXNU-sheng.", "CONFIG_XNU_NATIVE_RAM_BLOCK=y: UniXNU RamBlock's NativeRamBlock (package/NativeRamBlock.cpp and its headers, unchanged copies of RamBlock 4be2d7e) built by scripts/build-fuxi-ram-block.py with the IOBlockStorageDevice addresses of scripts/fuxi_storage_abi.py; the native personality starts it, and it publishes a RAM disk from the loader as a block device. package/FuxiRamBlockStore.cpp answers its persistent-store hooks with no store."]
procedure = ["Select a UFS component after the firmware boots."]
findings = ["Build #28 (2026-11-04, run 41834879040, log artifact fuxi-build-logs-1) cleared the whole archive stage — archive-12-build-fuxi-ufs prints PASS (NativeUfsBlock 23 own slots, 11 original storage imports bound), so the Build #27 symbol-length fix and the validate() publication patch are in — and failed at the kernel link with 17 duplicate symbols, in two groups. Eleven are the original IOBlockStorageDevice aliases, defined by both libRamBlock.a's and libShengUfs.a's original-bindings.o (the same 11 imports, at the same fuxi_storage_abi.py addresses): the kernel build script's own rule for the virtio transport is one exact alias definition per original class, so scripts/build-fuxi-ufs.py no longer emits original-bindings.o and NativeUfs.o's audited imports resolve against the RAM block's aliases; the audited set is still recorded in its bindings.json. Six are the native_ufs_store_* hooks: package/FuxiRamBlockStore.cpp defined no-store stubs for them from when fuxi had no storage driver (its header says ShengUfs provides them on sheng), and the vendored driver defines the real ones, so the stubs are removed and the file stays as an empty translation unit; the driver's store mode is the sheng-data-persist boot argument, unset on this board, so it reports mode 0 and NativeRamBlock's behaviour is unchanged.", "Build #27 (2026-11-04, run 41832471725, log artifact fuxi-build-logs-1) got past the driver compile — the Build #14 timing gate works, NativeUfs.cpp now compiles with warnings only — and died in scripts/build-fuxi-ufs.py line 99 with StopIteration: the script looked the vtable and method symbols up as __ZTV15NativeUfsBlock / __ZN15… / __ZNK15…, but NativeUfsBlock is 14 characters, so its mangled names carry 14, not 15. Both lookups are corrected to 14. The same pass exposed a runtime gate no compile fix reaches: startRoot's Operations::validate() returns false unconditionally without NATIVE_VERIFIED_BLOCK, so ufsPrepareRootWindows would discard every prepared window at the Identity phase and publish nothing; the vendored copy now carries a second fuxi patch returning true in the unverified branch (OS/SystemOS distinctness is still enforced by ufsBuildRootPlan; see the first-boot decision in configuration).", "Build #14 (2026-11-04, run 41828936792, log artifact fuxi-build-logs-1) reached the driver compile and failed with exactly three errors, all in NativeUfs.cpp lines 1878-1880: timerTicks and native_ufs_read_ticks are used ungated in the read path but defined only inside the NATIVE_VERIFIED_BLOCK region — upstream compiles this driver only in that mode, so the unverified mode never compiled. The vendored copy carries one fuxi patch gating those two timing statements the same way (marked in the source); everything else in package/ufs/ stays byte-identical to UniXNU/ShengUfs af14068.", "Build #13 (2026-11-04) failed in the new archive step: the vendored sources were placed in a top-level kits/fuxi/ufs/ directory, which the build tree never sees — the tree links the device package directory as kits/<kit>, so device sources belong in package/. The sources moved, unmodified, to package/ufs/ (the script path kits/fuxi/ufs/ is unchanged, as it resolves through that link).", "Device-side UFS driver build (2026-11-04): scripts/build-fuxi-ufs.py compiles the vendored kits/fuxi/ufs/NativeUfs.cpp without -DNATIVE_VERIFIED_BLOCK (the catalog component build sets it unconditionally, and its policy data cannot be produced for fuxi yet), replaying the IOPlatformExpert compile record and binding NativeUfsBlock's IOBlockStorageDevice imports through scripts/fuxi_storage_abi.py, the same treatment as the RAM block; without the define the driver publishes each SHNGROOT manifest window after geometry checks and serves reads without per-block policy verification.", "Owner decision (2026-11-04): the first UFS boot runs without the owner-root trust chain (see configuration) — Build #11 failed on its missing probe archive — so first-boot root acceptance is the SHNGROOT manifest verification in the driver alone; porting the owner-policy pipeline is a separate later step.", "CI Build #10 (2026-11-04, native-ufs-root @ bdb1410) failed in Build kernel: the owner-root trust guard rejected the configuration because neither a virtio block nor a source-storage binding was enabled; the fix adds the VirtioMmioBlock component and CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y (see configuration). Build #9 was cancelled by the newer push, so no UFS kernel artifact exists yet.", "Other fuxi ports report the UFS controller hand-off from the firmware as usable; not reproduced here.", "RAM root paths (2026-11-03): handed over as md0 (rd=md0), a RAM disk is a BSD device without IOMedia, so nothing loads APFS, and mockfs, which the OS fragment enables and which accepts any device, is asked before any kext filesystem (devfs, nullfs, bindfs, mockfs and routefs come first in xnu-10063's list). Through NativeRamBlock the disk is an IOMedia: APFS attaches, publishes its volumes, and the root can be chosen by volume UUID (payload.adt.root_match_volume_uuid), as sheng roots on UFS. APFS, IOStorageFamily and the HID kexts are prelinked in the fuxi kernel.", "UniXNU binds NativeRamBlock through build/storage-abi/interface-audit.json, which needs a research candidate kernel and a gdb observation that CI does not have. IOBlockStorageDevice sits at the addresses UniXNU's marble-milacy port records: vtable 0xfffffff005cb44c0 (address point +16, 190 slots, 14 pure), metaclass 0xfffffff006add1d0, constructor 0xfffffff00496ed98, D2 0xfffffff00496edb8, with D1 and D0 brk traps; the prelinker bound the family to this kernel's IOService constructor and destructor.", "Device (22579b4, image r2-ramblock): the restore ramdisk mounts as root through NativeRamBlock. DarwinBoot hands over the packed disk, APFS attaches to the whole disk, IOFindBSDRoot finds the volume by UUID and vfs_mountroot mounts it; the managed pages drop by the disk's 129.6 MiB. bsd_init then panics with rootvp not authenticated after mounting: a non-macOS boot requires a sealed root unless bsd_rooted_ramdisk(), which tests the rd boot argument for the prefix md0. rd=md0-ramblock marks the RAM-disk root and leaves IOFindBSDRoot on the UUID match (its md path needs exactly three characters).", "User space from the restore ramdisk (11db5c0, image r3-ramblock): with rd=md0-ramblock bsd_init skips the sealed-root check, and launchd (pid 1), restored_external (pid 3) and mount_tmpfs (pid 4) run from the ramdisk's APFS volume on /dev/disk1s1, trusted by the restore trust cache. The full OS (OS and SystemOS images, about 7.9 GiB) does not fit a fastboot payload; it needs another delivery, a USB receiver in the firmware (as mouse233's port has) or a UFS driver.", "Full-OS delivery decided (2026-11-04): the native UFS root. The firmware USB-receiver route (mouse233's receiver stack transplanted into this board's firmware, through his DWC3 driver and his production build defines) reproduced his stack faithfully on the owner's unit — the SMMU route installed with his own recorded values (bank 5, CBAR 000100FF, SCTLR 000000E0) and the device enumerated fully on the host — but the link would not stay up (link state flapping in his sampler, repeated bus resets clearing every session), the same wall his notes at that revision end at; the missing layer is the platform base under the USB stack (the eUSB2 repeater, regulators and reference clock are ABL-inherited state the firmware does not drive), not the transplanted files. The owner stopped the RAM route.", "Host (2026-11-04): the userdata geometry is GPT-verified from the official HyperOS OS3.0.308.0.WMCCNXM fastboot ROM (gpt_main0.bin: userdata is the last LUN 0 partition, first LBA 3110976 = 0x2F7840; its last field is the Qualcomm grow sentinel, so the span is the unit's own getvar size 0x3804BBB sectors and the last LBA is 61850618 = 0x3AFC3FA). scripts/build-userdata-root-image.py (fuxi port of UniXNU-sheng's builder pair, reading the decoded image files directly instead of hdiutil) built the root image and the whole-partition Android sparse image; the manifest parses back under the ShengUfs RootLayout.h rules and both window hashes match the recorded IPSW extraction. Nothing has been flashed.", "Device chain (2026-11-05): the userdata image was flashed and probe=11 read it back on the unit (manifest status 0, windows 2, both window SHA-256 prefixes equal to the build manifest), but the plain boot never mounted the UFS root. Root cause by source inspection: prepare() zeroes gPendingUuid and only the NATIVE_VERIFIED_BLOCK branch of validate() fills it (signedVolumeUuid), so in this board's unverified build the publisher's per-window media wait (mediaWithUuidExists) matched IOMedia on an empty UUID string and could never succeed; RootPublication.h publishes SystemOS first and discards later windows when a wait fails, so the OS window never started and the kernel's root-matching (see configuration) waited in vain. Third fuxi patch in NativeUfs.cpp: with an empty UUID the wait falls back to ancestry alone - any IOMedia whose ancestor chain reaches the window counts as its published media; verified builds always fill the UUID and are unchanged. scripts/build-fuxi-ufs.py's docstring records all three patches.", "Owner-root chain in the driver build (2026-11-05): scripts/build-fuxi-ufs.py now compiles the vendored NativeUfs.cpp with -DNATIVE_VERIFIED_BLOCK=1 and -DNATIVE_VERIFIED_BLOCK_MULTI_POLICY=1 and the VerifiedRoot include, mirroring UniXNU's build-arm-driver.py for this component, and also compiles package/SourceRootBinding.cpp (the board root binding, from UniXNU-sheng, BSD-2-Clause-Patent) into libShengUfs.a; its native_verified_block_root_authorized is what bsd_init consults after the pubfix2 panic. In verified mode validate() fills the publication UUIDs from the signed policies (signedVolumeUuid), so the media wait matches on the real UUID; the third fuxi patch's ancestry fallback remains for the unverified branch only. scripts/build-fuxi-owner-root.py runs first in the archive order: it extracts the two IPSW volume members into the firmware cache over HTTP range requests (digests asserted), signs both policies with a per-build owner keypair (the OS policy by UniXNU's build-owner-os-policy.py over the hdiutil-attached volume; the SystemOS policy by kits/VerifiedRoot/tools/manifest.py over the raw image, with the same full C verification), and runs build-verified-root-probe.py to compile the bundle the defconfig archive points at. The policies are the full form (hash tables in the kernel, about 73 MB for both volumes), so the flashed version-1 root image needs no '.vroot' objects. Generation was proven on the host before the first CI run: both policies were signed over the pinned extractions and every block of both images verified against them with the kit's C implementation (OS 1483785 blocks, SystemOS 806400).", "Build #35 (2026-11-05, ec981af2) was the pipeline's first CI run: the range-request extraction, the keypair and host library, the hdiutil attach and UniXNU's OS policy script all passed in the runner (its own PASS line: every 1483785 OS block verified by real C/RSA), and the mirrored SystemOS verification passed (806400 blocks); the run failed only at the last step, build-verified-root-probe.py, whose replay of the bsd_init compile record names header-export staging directories under build/xnu/ios-obj/EXPORT_HDRS that the bootstrap pass - which stops at its link - never created (EXPORT_HDRS/libsa), and its -Werror makes the missing directory fatal although none of the three probe sources include anything from it. scripts/build-fuxi-owner-root.py now creates the record's missing staging directories before invoking the probe builder.", "Build #36 (2026-11-05, 24ca111d) cleared archive-01 - the staging-directory fix worked and the bundle compiled ('PASS: owner-root policies signed and bundle compiled') - and Device documentation went green again (its base now carries a valid record). The build then failed at archive-14, the upstream build-virtio-mmio-bindings.py step copied from sheng's wiring: it reads build/storage-abi/interface-audit.json, a maintainer research record produced from a prelink candidate and live debugger metadata, which no build step creates and a fresh CI tree cannot have. The fuxi line's own answer to the same problem already existed for the RAM block: scripts/build-fuxi-virtio-bindings.py now binds NativeVirtioBlock from the recorded ABI data in scripts/fuxi_storage_abi.py, exactly like build-fuxi-ram-block.py, and writes bindings.json in the shape the baseline's dual-transport check consumes.", "Build #37 (2026-11-05, 61dd82fb) cleared archive-14 - the new fuxi virtio bindings passed (PASS: NativeVirtioBlock 25 own slots, 11 original storage imports bound) - then failed at archive-15, the first NativeUfs compile: kits/fuxi/ufs/NativeUfs.cpp:18 'VerifiedBlockPolicy.h' file not found. The header lives only in UniXNU drivers/VirtioMmioBlock/, and scripts/build-fuxi-ufs.py passed only kits/VerifiedRoot/include for the verified build; upstream scripts/build-arm-driver.py's NativeUfs recipe adds both includes, so the fuxi script now adds -I drivers/VirtioMmioBlock beside the VerifiedRoot include. Earlier unverified builds never hit this because the include is guarded by NATIVE_VERIFIED_BLOCK.", "Build #38 (2026-11-05, 449c1a2): archives 14, 15 and 16 all passed - the fuxi virtio bindings (25 own slots, 11 imports), the verified UFS archive with the root binding (23 own slots, 11 imports; the drivers/VirtioMmioBlock include fixed the VerifiedBlockPolicy.h failure of Build #37) and the touch archive - and Device documentation was green. The kernel stage then failed in the baseline's own dual-transport reconciliation: it addresses each transport's object by its archive's stem (libVirtioMmioBlock.a -> VirtioMmioBlock.o, libRamBlock.a -> RamBlock.o) and hashes it against bindings.json's compiled_object_sha256, but both fuxi binding scripts wrote only the Native*.o objects, and the RAM block report lacked the hash key. Both scripts now also leave a byte-identical stem-named copy of the compiled object, and build-fuxi-ram-block.py's report carries compiled_object_sha256.", "Build #39 (2026-11-05, a16027c2) reached the kernel link itself: every archive passed, the dual-transport reconciliation accepted both bindings, and the link failed on exactly one undefined symbol, _boot_progress_poll, referenced from NativeUfs.o's verified read path (ufsReadWindow). In verified mode the driver polls the boot-progress hook while reading; this board had the option off, so no archive defined it. CONFIG_XNU_BOOT_PROGRESS=y (see configuration) makes the baseline build and force-load libBootProgress.a.", "Build #41 (2026-11-05, 23498668) was the trust chain's first fully green build (kernel SHA-256 12aef95d02ca684f977ed8f7360c24e87335e0e0edae41b9579c87df126296ff), after Build #40 exposed a script the baseline invokes but this tree never carried (scripts/build-boot-progress.py, added as a fuxi script compiling weak no-op definitions of the boot-progress entry points). Device (chain41, boot-only, locally assembled with the phone's own chip id): the UFS root mounted, FSIOC_KERNEL_ROOTAUTH passed through the owner escape hatch, and /sbin/launchd was exec'd from the System volume - the trust chain's target gate is down. launchd was then killed by the exec security policy (OS_REASON_EXEC, EXEC_EXIT_REASON_SECURITY_POLICY): the payload carried no trust cache at all (payload.json trust_cache_sha256 was null), so AMFI had no CDHash for the full-system launchd.", "Scratch Data seed built in the image job (2026-11-05): scripts/build-fuxi-data-seed.py attaches the extracted OS image (044-76040-038.dmg, digest-pinned as in scripts/build-fuxi-owner-root.py) read-only, formats a 256 MiB APFS container (volume OwnerData) with hdiutil, copies the System volume's initial private/var tree into it by UniXNU's prepare-owner-data-fixture.py recipe (staged_system_apps excluded, symlinks and modes preserved, keybags, mobile/tmp, tmp and run added, tmp 1777) and rewrites the volume UUID to the pinned 18AB5557-DC2D-469B-8758-855E60F5B0DF. A freshly formatted volume's UUID is random and no macOS tool sets it at creation, so the script replaces every raw occurrence of the created UUID - measured on this IPSW's SystemOS image, whose volume UUID occurs exactly five times, all in APFS volume-superblock checkpoint blocks at in-block offset 240 - and repairs each touched block's Fletcher-64 object checksum, restoring both invariants measured on genuine APFS objects (the full block's first Fletcher sum is zero; the stored high half equals the second sum with the checksum field zeroed). The patcher refuses any occurrence outside a volume-superblock block, and the patched seed is accepted only when a re-attach makes diskutil report the pinned VolumeUUID. Selection on the kernel side needs no verified-root change: package/NativeRamBlock.cpp's native_ram_block_volume_seed matches the unique IOMedia whose UUID property equals the pinned value and whose provider chain contains the RAM block, and the mount itself is a plain writable APFS mount at /private/var - the seed is guest-mutable and unsigned by design (upstream's checkpoints record initial_seed_signature_verified=false for the same construction). Acceptance state for the device boot: native_owner_data_stage==4 with status==0 and readonly==0, the state upstream's check-native-ram-data-checkpoints.py qualifies. The persistent store stays off (package/FuxiRamBlockStore.cpp answers the store hooks with no store and the board's store mode is 0), so the volume is per-boot ephemeral.", "chain47 device result (2026-11-06): the Build #53 image (head ab2c9091, kernel 298b874e) booted with Sending and Booting OKAY from a hash-verified file, but the screen stayed black from start to finish and no report page ever appeared; the sibling chain46 image booted normally on the same unit minutes later (touch report page, SYS root apfs /dev/disk1s1 1:launchd), so the hang is in the Data stage delta. Source audit the same morning (host): native_owner_data_prepare has no waits and every glue failure panics visibly; selectVolumeSeed is one-shot snapshot matching (a miss returns ENOENT and panics); native_owner_publish_boot_manifest is bounded computation over resident state and its digest query is the same verifiedVolumeQuery the root authorization has used since chain41, so the only no-timeout call in the new path is the synchronous APFS mount() of the seed. APFS comparison of the CI seed against this IPSW's SystemOS and System volumes (host, all three images parsed): the seed's UUID patch is complete (all three volume-superblock copies carry the pinned UUID and pass both Fletcher-64 invariants) and the container feature words are identical everywhere; the seed alone declares apfs_incompatible_features 0x1 (case-insensitive) without 0x8 (normalization-insensitive) - the IPSW volumes declare 0x28 and 0x8 - and it was formatted by newfs_apfs 2811 (macOS 26) against the IPSW volumes' 2142. scripts/build-fuxi-data-seed.py now rewrites the incompatible word 0x1 -> 0x8 in the same patch pass (asserting the formatter value first, Fletcher-repaired, re-verified after patching; unit-tested on this host against the Build #53 seed: exactly the three superblock copies change, only in the checksum words and the one feature byte). Acceptance unchanged for the next device boot (chain48).", "chain48 device result and the formatter-generation move (2026-11-06): chain48 (Build #54) hung with the same pure black screen as chain47 on device, exonerating the incompatible-feature word (it was the only functional delta; the runner-toolchain firmware delta is not the common factor - chain47 blacked on the 26.7.2-built firmware volume and chain48 on the 26.6.2-built one). The seed's remaining delta against the IPSW volumes is its formatter generation: newfs_apfs 2811 (macOS 26) against their 2142 (iOS 17 era), with the trigger expected below the superblock (omap/btree/spaceman). scripts/build-fuxi-data-seed.py now also runs standalone with --from-ipsw (range-extracts the pinned OS member itself, since the workflow seed job has no kernel build tree to take the dmg from) and its patch accepts the formatter declarations 0x1 and 0x9 as well as an already-conforming 0x8, always normalizing to 0x8 and recording the observed values in seed.json (incompatible_features_from). Unit-tested on this host against the Build #54 seed: all three branches return (3, 3) with the diff confined to the checksum words, the UUID field and the one feature byte, and the 0x1 branch reproduces the CI seed byte-for-byte. The workflow change that runs this script in a macOS 14 job lands in the following commit (configuration finding there).", "Packed seed delivery (2026-11-06): scripts/pack-fuxi-data-seed.py is the baseline's own DBRDISK1 packer vendored byte-identical except for its provenance header (UniXNU drivers/DarwinBoot/Test/packed_ramdisk.py at 6ae4c252, sha256 efb5fac21ae94dcb1aecd47da2b73a7112b487e43692ac6396858552d27a0e48 before the header was added): it packs a raw APFS seed into the DBRDISK1 extent form losslessly (zero pages become omitted ranges) and refuses to write a file whose reconstruction hash differs from the input's. Host check on this machine with the Build #59 seed (data-seed.cdr, sha256 b6bc412bc4a002fd58b7e3ca5875d109d9850b7087b0fce7c208b36f4319ec1c): owner-data.dbr is 1,003,616 bytes, encoded sha256 503ebd937f4dd8921f57165cfe423c665df7316a5b40b4f7d597ca2e083b8fe4, and the packer's reported logical sha256 equals the dense seed's hash, so the packed form carries the identical volume (pinned UUID 18AB5557-DC2D-469B-8758-855E60F5B0DF, APSB incompatible 0x8 on all copies).", "Device (2026-11-06): chain50 - the chain49 kernel and firmware, the Build #59 seed delivered packed as above, payload size_mib 192 - booted normally: the panel shows userspace running deep (the exit report's tail records watchdogd[139], pages=0x1229df), far past chain46's 'mount[3] exited' status-66 terminal state, with no 'offline scratch Data mount failed' panic, so the scratch Data mount completed and launchd ran with a writable /private/var; the owner reports the boot as smooth as the earlier good boots (photograph archived with the goal record as chain50-device-boot-2026-11-06.jpg). The four preceding pure-black boots (chain47/48/49 and the disc1 discriminator) are thereby attributed to the firmware's handling of the dense seed in the payload, not to the kernel's Data code, the seed's APFS content or its formatter generation: those theories are closed. The Data stage is complete in the packed, ephemeral form; a persistent Data volume (the packed seed grown to the storage size with the userdata store window, as in UniXNU's userdata concept) remains a separate, unstarted step.", "Device (2026-11-06): chain51 - assembled locally from Build #62's CI artifacts at head da47a1eb (the first image whose seed the workflow itself packed; payload.json's data_ramdisk hash equals the artifact's data-seed.dbr, the ADT carries PackedRAMDisk only, payload 192 MiB) - booted normally, indistinguishable from chain50: the exit report records watchdogd[140] with the same frame addresses as chain50's photograph, pages=0x1229e0, free=0xaa5d2. The packed-seed formalization is therefore verified end to end on the device: the repository state at da47a1eb produces the bootable form with no local configuration deltas, and the Data stage is closed in its CI form. The persistent form follows as its own stage (phase A: the vendored seed grower).", "Persistent Data stage, phase A (2026-11-06): scripts/grow-fuxi-data-seed.py vendors the baseline's seed grower (UniXNU scripts/seed-data-grow.py at 6ae4c252, sha256 507bce30053936608ebf4d5b7de75397d7e544934a9949a071a244cc0a3c810c before vendoring; the vendored copy is byte-identical except its provenance header and three adaptations recorded in that header: the packed_ramdisk import loads the sibling vendored packer instead of the UniXNU tree's DarwinBoot submodule copy, the scratch directory is the system temp instead of the tree's build directory, and nothing else). It grows a packed seed's APFS container with macOS diskutil (resizeContainer) and repacks it, keeping only the nonzero pages and the volume UUID, so the OWNER_DATA_VOLUME_UUID pin stays satisfied. The size is the grower's own --auto result for this board, passed explicitly because the CI tree has no build/userdata-root report: userdata capacity 240,597,577,728 bytes (board.toml [userdata], GPT-verified) minus the flashed root image 9,382,658,048 bytes (build/userdata-root/userdata-root.json: the OS window 6,077,580,800 bytes at offset 1 MiB and SystemOS 3,303,014,400 bytes after it), a 4 MiB guard and the 1024 MiB log reserve leaves 230,136,983,552 bytes, from which the formula (store footprint = container pages + bitmap + one header block, then one GiB of margin) gives a 213 GiB container (228,707,008,512 bytes; store footprint 228,713,992,192 bytes, ending 2,496,733,184 bytes short of the partition end). The workflow change that runs it in the data-seed job lands in the following commit (configuration finding there); the payload still consumes the 256 MiB seed, so phase A changes no boot behaviour - the persistent store stays in mode 0 until the persist boot argument lands with phase B.", "Persistent Data phase B, the read-only proof (2026-11-06): with sheng-data-persist=1 (see configuration) the kernel attaches the store window the phase A grow sized - the 213 GiB container at the end of userdata - in read-only probe mode against the grown seed. Acceptance is photographic, from the new exit-report rows (see configuration): the window is recognized (state 1 blank on this first attach, then 6 resumed read-only; 7 kept would mean the store holds no Data of this seed), native_data_persist_writes and syncs stay 0, the GPT check is unchanged across the attach (gpt == gpt_after), and the boot otherwise matches chain51. Any refusal leaves the disk volatile (state 4) and Data runs from the seed, exactly as without persistence. Phase C (persist=2, real writes; acceptance: /private/var state survives a reboot) is not part of this step and waits for the owner's separate approval at its gate.", "Persistent Data phase B device proof (2026-11-06, chain54 photograph): the store window opened at first_lba 0x57bd52, exactly the designed position (partition last LBA 0x3AFC3FA minus the 1024 MiB log reserve of 262144 blocks minus windowBlocks(55,836,672 pages) = 55,838,377 blocks, plus 1), and overlay.open returned Blank: st=1 with hdr=1 (persist::checkHeader found no SHNGDATA magic - the window had never been written), ld=1 (the single header block read at open), pres=0. wr=0 and sy=0 across the boot prove the persist=1 probe wrote nothing; native_ufs_store_gpt_check returned 0 before and after the attach (its 0 is the CRC-verified-unchanged result; 1-5 are distinct failures). The st 1-then-6-or-7 expectation recorded earlier was imprecise: state 6 (resumed read-only) requires this seed's Data already in the store and state 7 (kept) requires a foreign header, so a virgin window's correct terminal reading is 1. Phase B is closed; phase C opens writes (see configuration).", "Persistent Data phase C install boot (2026-11-06, chain55 photograph): the store window at first_lba 0x57bd52 now holds this seed's overlay - a generation-1 SHNGDATA header written after the zeroed bitmap, and 33,223 present pages (about 130 MiB of Data changes) written through with syncs (wr=33243 page writes, sy=280 commits, er=0) - against the persist=1 probe's pres=0 and wr=0 on the same window. GPT checks stayed 0/0 and the boot otherwise matched chain54. What remains for phase C is the resume boot: persist=2 without the reset argument (see configuration), whose photograph must show the install boot's header recognised (hdr=0, st=2, pres>0).", "Persistent Data phase C closure (2026-11-06, chain57 photograph): the store window at first_lba 0x57bd52 holds a resumed overlay with 81,386 present pages (about 318 MiB of Data changes accumulated over the install and resume boots; the install boot's photograph showed 33,223 because its counters are sampled at the watchdogd exit while its write-out was still landing). GPT checks stayed 0/0 across all three phase C boots and no boot reported a store error (er=0 throughout). The window's contents are keyed to the grown seed df83bf77...: a future boot that should keep this state must carry that seed (or a byte-identical regrow); any other seed is treated as foreign - kept and untouched - by design (chain56).", "Build #98 archive-01 stall and RangeFile bound (2026-11-08): Build #98 (run 42432523750, head b441ff2f) was cancelled by the owner after its Build kernel step sat in archive-01 for about 2h50m with a zero-byte archive-01 log; the tee record ends at the build-fuxi-owner-root.py invocation and the formal kernel build never started, so no kernel.log existed. The script's RangeFile fetched the IPSW volume images from the Apple CDN with two urllib.request.urlopen calls (HEAD for the size, ranged GET per 8 MiB block) that carried no timeout, and its extracting print had no flush, so one stalled CDN connection blocked the build indefinitely and the block-buffered log showed nothing; Build #97 passed the same script unchanged, so the stall was a transient connection failure amplified by the missing bound, not a deterministic error. scripts/build-fuxi-owner-root.py now routes every CDN request through a bounded helper (30 second socket timeout, at most 3 attempts with 2s and 4s waits, only recoverable network errors retried) that logs the final failure with its URL, request kind and exception before re-raising, and flushes its key prints, so a stall fails fast with a diagnosable log. Host verification (2026-11-08): HEAD and ranged GET succeed against a local server, full/mid/tail reads and a zipfile extraction over RangeFile stay byte-identical, a stalled HEAD and a stalled body each raise TimeoutError after exactly 3 attempts, an HTTP 500 is retried 3 times with the 2s/4s waits observed, and an HTTP 404 is not retried."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory."]
