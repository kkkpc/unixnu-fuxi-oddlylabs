[[area]]
id = "power"
status = "implemented"
components = []
paths = ["package/*Battery*", "package/*Power*", "package/QcomRpmh*", "scripts/*power*", "scripts/*battery*", "scripts/*pmgr*"]
inputs = ["RPMh command database (/sys/kernel/debug/cmd-db on Android) and the regulator summary with the screen on and off."]
configuration = ["package/QcomRpmh.c and QcomRpmh.h are the UniXNU-sheng RPMh helpers; the touch probe uses them for its two rails.", "PMGR bridge for AMFI: package/ShengPlatformPower.cpp is an unchanged copy of UniXNU-sheng's (08cde20); scripts/build-fuxi-platform-power.py builds it into build/sheng-platform-power/libShengPlatformPower.a, which build-xnu-4k-baseline.sh force-loads with CONFIG_XNU_SHENG_PMGR=y; the SoC patch sheng-platform-power.patch calls sheng_pmgr_run() in bsd_init after bsd_bufferinit, and the boot argument sheng-pmgr=2 makes it publish the original ApplePMGRNub with a ShengPlatformPower provider."]
procedure = ["Record each rail a driver needs from the command database and the regulator summary.", "PMGR bridge: ci/check-pmgr-bridge.py checks the linked kernel (the image job runs it after the prelink)."]
findings = ["Panel rails vci 3.0 V, vddio 1.8 V and vddd 1.5 V are off while the screen is off; the touch rails stay on.", "Without a PMGR the boot panics with 'AMFI: No PMGR?' at ConfigurationSettings.cpp:235 (2026-11-02, the first stage 4 image): AMFI, prelinked unchanged, waits for an ApplePMGRNub service from a thread call. Stage 3 images never showed it because the touch probe panics first, within a second of bsd_init.", "What AMFI does with the nub (UniXNU scripts/audit-amfi-pmgr-contract.py, checked in this kernel by ci/check-pmgr-bridge.py): it reads through the nub, ORs in bit 2 and writes the value back; the nub dispatches to the provider at nub+0x88, slots 320 and 321, and ApplePMGR's own implementations return 0xffffffff and do nothing, as the iPad's AppleT8011PMGR does. No power hardware is involved.", "UniXNU-sheng's build script checks the provider table against a prelinked candidate left by an earlier local build, which a fresh CI tree lacks (Kerfand published such a kernel as a release asset, which this repository does not do: it holds Apple's kernelcache). scripts/build-fuxi-platform-power.py keeps every object check and binds slots 320 and 321 to the audited addresses; ci/check-pmgr-bridge.py checks the provider table, the instruction contract and the bsd_init call in the kernel that ships.", "On the device the bridge satisfies AMFI (484a650, image p1-pmgr, no touch probe): the boot passes the old panic and ends in the root device wait (60 s in the source, not measured) with Failed to mount root device, the expected end for a payload without a root volume. No unimplemented-operation panic appeared on the way."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["Only the touch rails are used.", "The PMGR bridge is not power management: every power operation of ShengPlatformPower panics (ShengPlatformPower: unimplemented operation N), so anything that asks the PMGR for CPU, clock or sleep control stops the boot with that message."]
next_action = ["None for the bridge. Record the operation number if a ShengPlatformPower panic ever appears; the next power work is the panel rails, when a display driver needs them."]
evidence = [
  { kind = "device", command = "fastboot boot of the stage 4 image t4-touch (SHA-256 a43145873cbdfd7e): the run 41378843724 kernel with fuxi-touch=4 fuxi-touch-panic=2", revision = "d7aaf7d94f7ef6ec44abab4f60f61013a969e374", reference = "evidence/2026-11-02-first-boot.md", result = "Panic screen: AMFI: No PMGR? at ConfigurationSettings.cpp:235, from a thread call; no touch report" },
  { kind = "source", reference = "package/ShengPlatformPower.cpp", result = "UniXNU-sheng PMGR bridge, unchanged" },
  { kind = "device", command = "fastboot boot of image p1-pmgr (SHA-256 cba346b63087500c): sheng-pmgr=2 without the touch probe", revision = "484a6508b6b37c780500a9742f2e2b4cee3cd4a7", reference = "evidence/2026-11-02-first-boot.md", result = "Panel: Failed to mount root device at IOKitBSDInit.cpp:984 (frames IOFindBSDRoot, bsd_init, kernel_bootstrap_thread); no reset" },
]

[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink"]
paths = ["scripts/*payload*", "scripts/*trust*", "scripts/*image*", "scripts/*flash*", "patches/**", "ci/*boot-image*"]
inputs = ["The iPadOS 17.7.11 restore image of the OS profile (members fetched with range requests), a platform seed, the firmware volume, the firmware's FdtBlob."]
configuration = ["patches/xnu/series applies zzyf-sheng-amp.patch (unchanged from UniXNU-sheng 08cde20) and fuxi-touch-probe.patch after the arch, SoC and OS series.", "[payload] kernel_args set the touch probe stage and its panic report; panic_screen = true; [payload.adt] owned_memory_size 0x130000000.", "[bootimg] payload = \"image\" and [bootimg.image]: header v0 (fuxi-legacy.toml's container), text_offset 0. The options are in OddlyLabs/UniXNU branch fuxi (scripts/unixnu/bootimg.py)."]
procedure = ["./unixnu build kernel; ./unixnu build payload --uefi ../uefi-fuxi --unique-chip-id <seed>; ./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG; ./unixnu bootimg --uefi ../uefi-fuxi --target DEBUG --dtb <FdtBlob>.", "CI encrypts boot.img to ci/boot-image-recipient.pem; ci/decrypt-boot-image.sh decrypts it with the owner's private key.", "Probe variants: probe keys in [payload] of a scratch copy of board.toml, ./unixnu build payload --kernel <decrypted kernel.macho>, ./unixnu bootimg --fd <firmware volume from check-boot-image.py --fd-out> (README, probe images)."]
findings = ["scripts/build-userdata-root-image.py (2026-11-04) builds the flashable userdata root for the native UFS root (see storage): it verifies the decoded OS and SystemOS inputs against the sizes and SHA-256 digests pinned in the script, and writes the SHNGROOT manifest image and the whole-partition Android sparse image under build/userdata-root/ (build products, not committed).", "fuxi-touch-probe.patch keeps only original XNU lines as context, so changes to the shared series around it do not break it.", "Measured on hardware in matejkoo217/uefi-fuxi: the ABL's fastboot boot refuses a header v4 image (Invalid Parameter), so the fastboot image uses the v0 container; and the ABL keeps the boot image ramdisk in vendor_boot, so the payload follows the firmware volume and the image size at header offset 0x10 covers it (Kerfand: 0x0C300200 for a 192 MiB payload).", "The first kernel build in CI at 8b4c03f linked and prelinked; bsd_init calls native_touch_probe in the linked kernel.", "The CI image at 2bbd399 advertises image size 0x0C300200 (shim 0x200, firmware 0x300000, payload 0xC000000), the value Kerfand measured for a booting 192 MiB payload. gzip brings the whole image to 11.1 MiB because the payload volume is mostly free space.", "The payload's ADT has dram-size 0x80000000 and darwinboot-memory-size 0x130000000, the values of UniXNU-sheng and of both community fuxi ports.", "zzyf-sheng-amp.patch belongs with the E/P cluster types of dts/fuxi.dts: without it the kernel panics in ml_parse_cpu_topology (see cpu). Both boards pin sm8550-common 23b2049, so the patch context is the same.", "On the device (e901139) the ABL accepts the v0 image, the firmware finds the payload after its volume, the UniXNU menu reads EFI/UniXNU/unixnu.toml from it, and DarwinBoot loads kernel.macho and its ADT: the kernel reaches bsd_init.", "Probe variants reuse the tested firmware: ci/check-boot-image.py --fd-out writes the firmware volume of a checked image (627fe52a for run 41273003819), and ci/decrypt-boot-image.sh writes the unpatched kernel next to the image when the artifact carries it.", "Payload trust cache (2026-11-05): new scripts/build-fuxi-system-trust.py (registered here via scripts/*trust*) range-fetches the IPSW's StaticTrustCache and Cryptex1,SystemTrustCache members, unwraps the IM4P, verifies every pinned digest (modules da88460e... and d121ba89..., bundle 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7) and emits upstream's bundle layout (bundle-ipsw-trust.py's: module count, offsets, static module first). Both modules are version-2 originals, so no v1-to-v2 conversion is needed, and DarwinBoot's ValidTrustCaches accepts up to 128 modules. payload.py copies the bundle to kernel.macho.trustcache only when --trust-cache is passed, which the workflow now does (see configuration).", "System trust bundle in the payload (2026-11-05): scripts/build-fuxi-system-trust.py builds upstream's two-module original bundle (StaticTrustCache plus Cryptex1,SystemTrustCache; 61,356 bytes; SHA-256 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7) in CI, the board pins that digest, and the payload step passes --trust-cache. Build #45's decrypted payload.json carries trust_cache_sha256 7416ca4f... where Build #41's was null, and the locally assembled chain45 payload embeds the same bundle (re-read and matched). On the device the bundle is what let launchd's exec pass AMFI in chain45.", "Data seed carried in the payload (2026-11-05): the 'Build payload' step now passes --data-ramdisk with the seed scripts/build-fuxi-data-seed.py builds (see storage); payload.py copies it verbatim to Payloads/scratch-data.img and adds initrd = \"Payloads/scratch-data.img\" to the xnu boot entry, so DarwinBoot hands it to the kernel as the RAM disk NativeRamBlock publishes and the scratch Data mount selects by UUID - this is the 'seed window registration' of the Data stage, and it needs no board.toml change. The encryption step also copies the seed into the artifact set as data-seed.cdr with its sha256, plaintext beside payload.json (it carries only the IPSW's initial var skeleton), so locally assembled verification images embed the identical bytes the CI payload used. Size: the dense seed is 256 MiB but its nonzero content is the initial var tree, and the payload region is compressed in the boot image, so the image stays well under this unit's fastboot max-download-size (805306368 bytes, from the 2026-11-01 getvar).", "Artifact set gains the packed seed (2026-11-06): the Build workflow's encryption step now also copies the packed seed into the encrypted artifact set as data-seed.dbr with its sha256, beside the retained data-seed.cdr, so locally assembled verification images embed the identical packed bytes the CI payload used (see configuration for the workflow wiring).", "The kernel patch set gains the two QcomXnuUsbDebug patches (2026-11-07), applied last in the device series after fuxi-touch-probe.patch: qcom-usb-debug-console.patch hooks pe_kprintf, printf, the serial console and the panic path of xnu-10063.141.1, and qcom-usb-debug-worker.patch adds the late worker and reboot threads to bsd_init. Both are the darwin24 retarget of the module darwin22 set (see configuration for the wiring) and are inert unless the kernel build defines XNU_QCOM_USB_DEBUG; applied on the full 65-patch stack, the six patched files carry hook counts identical to their pristine-tree application."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["CI artifacts still use the fixed bring-up platform seed; the boot-only verification images are assembled locally from the decrypted artifacts with the phone's own chip id, and only those are booted.", "The payload carries the kernel, the system trust bundle and (since the Data stage) the scratch Data seed; the root volume comes from the UFS userdata image, not the payload."]
next_action = ["Keep assembling verification images locally with the phone's own --unique-chip-id; the Data seed comes from the CI artifact set in packed form (data-seed.dbr), so the local payload embeds the identical bytes the CI payload used."]
evidence = [
  { kind = "host", command = "./unixnu build kernel --device fuxi", revision = "8b4c03f69fc15878d7ee92c0f157215fa235d78d", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41261795785", result = "Kernel linked and prelinked; bsd_init calls _native_touch_probe" },
  { kind = "host", command = "./unixnu build payload --uefi ../uefi-fuxi --unique-chip-id 0x0123456789abcdef; ./unixnu bootimg --uefi ../uefi-fuxi --target DEBUG --dtb <FdtBlob>", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "boot.img v0, 11677696 bytes (sha256 931ac9582632...), uploaded encrypted; decrypted with ci/decrypt-boot-image.sh, ci/check-boot-image.py passes: text offset 0, firmware and 192 MiB FUXIESP payload in the kernel image, FdtBlob appended, kernel.macho with the touch probe, its ADT and the boot arguments of board.toml" },
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "The image boots: ABL OKAY, firmware and UniXNU menu, DarwinBoot loads kernel.macho and kernel.macho.adt from the payload, the kernel reaches bsd_init and shows the touch probe report" },
]

[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["ci/**", "scripts/check-*", "scripts/probe-*", "package/*Probe*", "package/*Diagnostic*", "package/*Tests*", "unixnu.lock", "drivers/QcomXnuUsbDebug/**", "package/drivers/QcomXnuUsbDebug/**", "scripts/*usb-debug*"]
inputs = ["The panic screen of the payload (panic_screen = true) while no display driver runs."]
configuration = ["fuxi-touch-panic=1 ends the boot with a panic whose message is the probe's four diagnostic rows; the rows are also printed to the kernel log at each stage."]
procedure = ["Photograph the panic screen and compare the FTS rows with fuxi_touch_panel_porting.md section 7.2.", "On a boot with sheng-smp=1 also transcribe the two SMP rows (fuxi_touch_panel_porting.md section 7.2).", "Several images per sitting: after photographing a report the owner holds power and volume down, and the next image is booted from fastboot; the photographs are sent together."]
findings = ["package/ufs/RootDiagnostics.h is part of the vendored ShengUfs driver sources (see storage); it matches this area's package/*Diagnostic* path by name only and brings no diagnostics change.", "The other fuxi ports read their results from panic screen photographs as well.", "The DEBUG firmware prints its log on the panel before the handoff (matejkoo217/uefi-fuxi), the only console before the touch report.", "The earlier ci/ scripts compiled the probe inside a UniXNU-sheng build; the fuxi kernel build replaces them.", "ci/check-boot-image.py checks a decrypted image before fastboot boot against boot.json, board.toml and the firmware checkout: container and load addresses, the shim header, the firmware volume, the payload files, the ADT root and /chosen values, and the boot arguments.", "The panic screen draws through the kernel's frame buffer mapping in vinfo, which initialize_screen sets at the end of PE_create_console, so a panic before that leaves the panel as it was. A reset probe cannot tell its own reset from one caused by the code it wraps.", "The entry probe bands work on this panel: DarwinBoot's green band and the probe's blue and magenta bands appear in order, each 1/16 of the screen height, so the probe's use of the boot-args video geometry is right for fuxi.", "ci/decrypt-boot-image.sh also decrypts the kernel (kernel.macho.gz.enc) when the artifact carries it.", "ci/check-pmgr-bridge.py reads the prelinked kernel without tools (Mach-O segments and symbol table in Python); with --contract-only it checks only the AMFI -> PMGR contract, which passes on the e901139 kernel.", "The panic screen draws the touch report on fuxi: the probe's four rows, the panic frames and the page counters, below the green and blue bands (it paints over the magenta band).", "With sheng-smp=1 the touch report ends with two SMP rows (package/FuxiTouchProbe.cpp smpText) built from ArmCpu's secondary-core variables, which the probe references weakly as it does armcpu_spi_attach (no rows without ArmCpu); without sheng-smp the message is as before. Locally the rows compile without warnings under the probe's -Wall -Wextra -Werror (clang 21, arm64-apple-ios17), and every ArmCpu symbol is a weak reference; the CI kernel build is the check that counts.", "The SMP rows read on the panel (s2-smp, s3-selfipi). ArmCpu increments its shared IPI totals from several cores without atomics: in s3-selfipi the per-core counts add up to 85 while the total taken reads 84, so the per-core counts are the ones to use.", "ci/check-hid-bindings.py checks the HID bindings in the prelinked kernel: the IOHIDFamily instructions UniXNU pins, getMetaClass's metaclass, IOHIDDevice's 207-slot vtable with its 56 own slots at the bound addresses, and NativeHidInput's vtable, of which only its ten own slots may differ; --contract-only checks the family alone. With fuxi-touch-hid=1 the touch report ends with a HID row (FuxiHidProbe.cpp fuxi_hid_row), and the run ends only at a lift after the HID start has settled (device and event driver up, a step failed, or 20 s), so an early tap needs a second one.", "The touch report ends with a SYS row once a root is mounted (package/FuxiSysProbe.cpp fuxi_sys_row): the root's filesystem type and the device it came from, the first six processes by pid with their names, and the number of processes. ci/check-ram-block-bindings.py checks the RAM block bindings after the link, as check-hid-bindings.py does for HID.", "With HID requested, a tap before the HID start settles does not end the run, so the owner has to tap again after about 20 s: in h1-hid the only tap came early and the root device wait ended the boot first.", "The SYS row reads on the panel (r3-ramblock): the root's filesystem and device, the first processes by pid with their names (cut at 16 characters, as proc_name gives them) and their number.", "The QcomXnuUsbDebug channel (2026-11-07) replaces the panic-string photograph as the primary boot evidence: the patched console, kprintf and panic units tee printf, kprintf, IOLog and panic output to the module, which streams them over the DWC3 controller as USB CDC-ACM to the bench Mac from just after ExitBootServices (host collector: scripts/collect-xnu-usb.py inside the vendored module), with a control channel for status, a normal-shutdown reboot and an on-demand screenshot once a display provider registers. The module qualifies the inherited handoff by name - clocks, USB power domain, device role, SMMU stream - rather than hanging: USB stream ID 0x40 and the lowest free apps-SMMU context bank, against the ShengUfs UFS stream 0x60 and its reserved last bank, so the two coexist by construction. Whether the fastboot path of the firmware stops the DWC3 controller before the kernel handoff is not established from source; the first-boot USB acceptance question has since been answered by usb1 (2026-11-07); a qualify refusal names the failing condition. The FuxiBootProgress panic-string counters (persist, sksu, ui census) stay in place as the fallback channel. First device acceptance has passed (usb1, 2026-11-07: the device enumerated as the Qualcomm XNU Debug CDC gadget and streamed the full boot log; chain60 and chain61 have since captured their boot streams the same way), so the channel is an accepted evidence path.", "The channel's first CI wiring check (Build #83 at head 4b815cbd, 2026-11-07) failed before any compiling: both darwin24 patches applied, then archive step build-fuxi-usb-debug stopped on its module check - the vendored tree at drivers/QcomXnuUsbDebug is invisible to the tree assembler, which links only catalog-selected drivers, so no copy of the module existed at the kits/fuxi/drivers/ path the builder reads. The module's canonical home is now package/drivers/QcomXnuUsbDebug inside the kit (the kit enters the tree whole); the failure was in the wiring, not in the module or the patches, and the channel design is unchanged.", "Build #84 (head 82767b7a, 2026-11-07) failed in the image job's archive step, one layer deeper than Build #83: the module was found and compiled, but its own scripts/build.py import audit rejected the archive with 'unexpected XNU imports: [_qcom_reset_request]'. The symbol is the module's reset layer: kernel/QcomXnuUsbDebug.c declares it extern and the control REBOOT / REBOOT-FASTBOOT commit path calls it after draining the transmitter and claiming the request, but nothing defines it - not the module (its only definition is the host model test's stub in tests/test_usb_screenshot_control.c, which is why the host suite passes 28/28 while the archive audit fails), not the darwin22 or darwin24 patch sets, and not the UniXNU, sm8550-common or sheng trees (grep-clean; a GitHub code search also returns no definition). The author's commit messages at the pinned revision (409aec6, 1f9d82c, 3fec41c; upstream main is still 3fec41c) describe the design: the driver owns no reset register and hands both modes to a reset layer the consumer supplies, and REBOOT-FASTBOOT reached ABL in the author's own integration, whose implementation is not public. The contract is not named in the module's docs, so upstream issue ljhhkx529/QcomXnuUsbDebug#1 asks the author to confirm the ownership, where his build places the definition (the audit is archive-local with a fixed allowlist, so a kernel-side definition cannot pass it), what mechanism his fuxi mode 1 uses, and whether he sanctions a log-only opt-out. Local decision (owner-approved 2026-11-07, log first, reset deferred as its own stage): the module is NOT given a fake provider, and REBOOT-FASTBOOT is never downgraded to a plain reset - kernel/QcomXnuUsbDebug.c gains a QUD_CONTROL_REBOOT guard (default 1 = upstream behaviour bit-for-bit; insertion-only apart from the PE_halt_restart install expression the same guard prefixes in qcom_usb_debug_control_start) and scripts/build-fuxi-usb-debug.py appends -DQUD_CONTROL_REBOOT=0 to its adapted copy of the compile record, so both reboot verbs answer ERR/unsupported and the archive carries no unresolved reset reference. Host-side verification on this tree: the module suite passes 28/28 before and after the guard (it compiles the extracted handler without the define), the extracted handler compiled with the define set carries zero relocations against qcom_reset_request (one without it), and the one warning the disabled path exposed (unused parameter generation) is cast away inside the guard's else branch. The reset layer itself (plain REBOOT, then the fuxi fastboot reason mechanism - the UniXNU device records for alioth and munch document the PMIC PON-spare write plus IMEM readback shape on other SoCs; fuxi values are unmeasured) is a separate later stage and is not part of this change. Pre-push confirmation added the same day at the owner's request: the guard also gates the PE_halt_restart install in qcom_usb_debug_control_start (installed = QUD_CONTROL_REBOOT && QUD_PSCI_SMC_RESET && the compare-exchange), so with the define at 0 the module owns no reset path at all - no hook installed, no extern call - while the log transport and the HELLO / PING / STATUS / screenshot verbs are untouched; default 1 keeps upstream behaviour, hook included. A device-side host test (the production handler extracted with the real HELLO/PING/STATUS builders) drives all seven verbs in both modes: default answers REBOOT and REBOOT-FASTBOOT OK queued with two reset-layer calls; at 0 both answer ERR/unsupported with zero reset-layer calls, zero claims and no request left in flight, and the HELLO/PING/STATUS/SCREENSHOT/SHOTNEXT answers are unchanged with zero rejected frames. The archive audit was reproduced locally with build.py's own logic over the five units compiled for arm64: without the define the only unexpected import is _qcom_reset_request (the Build #84 failure); with it the external set is the allowlist minus _PE_halt_restart (folded away with the gated install) and every required export is present. The wrapper's record handling was verified the same way: the original compile record's hash is unchanged across a run, the adapted copy differs by exactly the one appended define, and the compile command build.py constructs carries it.", "Legacy display glue observation surface (2026-11-08): package/FuxiLegacyDisplayProbe.cpp reports through the existing evidence paths only - fuxi-legacy printf lines on the kernel stream the QcomXnuUsbDebug channel carries, plus volatile fuxi_legacy_* counters in the kernel image; it adds no channel, hook or transport. The glue's registration line and stage counter are the round-1 E5-A observation points for provider registration; its hook counters stay at zero in round 1 because the presentation arguments are not yet enabled.", "Legacy display glue linkage fix (2026-11-08): the 18 component callbacks in package/FuxiLegacyDisplayProbe.cpp moved into an extern \"C\" block so the glue object exports the C symbols the component declares (Build #95's final kernel link failed on the mangled C++ exports); the observation surface itself - the fuxi-legacy printf lines and the volatile fuxi_legacy_* counters - is unchanged, only the symbol linkage of the callback definitions changed.", "Build #96 linkage completion for the display glue: the two probe entry points in package/FuxiLegacyDisplayProbe.cpp are now defined with C linkage, matching the plain-C declarations the framework patch series adds to bsd/kern/bsd_init.c (the Build #95 note above wrongly stated the patch calls them in C++ form and that they had resolved); the builder also binds the component's weak_import _native_adreno_fences absent under evidence gates (see the display area's Build #96 finding). The fuxi-legacy observation surface itself is unchanged.", "Build #99 correction to the archive-18 diagnostic surface recorded in the Build #96 note above: the builder no longer binds _native_adreno_fences absent and no longer prints the absent-binding line - that binding was the #99 formal link's arm64_b26 fixup error (see the display area's Build #99 finding). archive-18 now prints 'board-provided provider import _native_adreno_fences: no GPU provider selected on this board; the board glue defines it returning false (the no-provider answer)', and build-report.json records board_provided_imports instead of the retired absent-binding fields. The fuxi-legacy observation surface itself is unchanged."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["Device records are panel photographs, transcribed in evidence/2026-11-02-first-boot.md; the photographs stay with the owner. No kernel log is kept: there is no serial console, and the ADT has no /pram node, so no panic region survives the reset.", "The QcomXnuUsbDebug USB log channel is device-verified (this entry corrects its pre-acceptance wording, which stood until 2026-11-07): the boot-only acceptance boot usb1 (2026-11-07) enumerated the device on the bench host as the Qualcomm XNU Debug CDC gadget (VID 0x1209, PID 0x316d, serial QcomXnuUsbDebug) and streamed the full boot log (57,217 bytes); chain60 and chain61 have since captured their boot streams the same way (64,061 and 76,456 bytes), so the channel is an accepted evidence path and the panel photographs and panic-string counters remain as the fallback record (see the configuration finding on the stage-2 activation for the wiring). In this stage the control channel's REBOOT and REBOOT-FASTBOOT verbs answer ERR/unsupported by design and the PE_halt_restart hook is not installed (QUD_CONTROL_REBOOT=0): the reset layer the module expects its consumer to supply is unimplemented, and no remote-reboot capability is claimed."]
next_action = ["Use the QcomXnuUsbDebug kernel log as the primary boot evidence path (device-verified by usb1, chain60 and chain61, 2026-11-07); keep the panel photographs and the panic-string counters as the fallback record."]
