]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt"]
inputs = ["OddlyLabs/uefi-fuxi, branch fuxi: a fork of UniXNU/uefi-sheng (the official Mu-Silicium fork for UniXNU) with the nine fuxi bring-up commits of matejkoo217/uefi-fuxi cherry-picked (authors kept, cherry-pick -x); its fuxiPkg derives from Silicium's SM8550 nuwa (Xiaomi 13 Pro).", "fastboot boot of the image (temporary, nothing is written to the device)."]
configuration = ["board.toml [firmware]: config fuxi, dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc, fd Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, and the submodules, edk2 patch and package path list of UniXNU-sheng's [firmware].", "fuxi.dsc: FUXI_VENDOR_HW = 0 (Mu drivers only; the previous stage keeps the panel scanning out), framebuffer 1080x2400x32, DDR base 0x80000000, the UniXNU menu, UniXNUDxe, DarwinBoot, DiskIo, Partition and FAT; FuxiBootMemoryDxe publishes the payload volume the shim hands over."]
procedure = ["./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (CI: the image job of .github/workflows/build.yml)."]
findings = ["UniXNU provides the boot menu (UniXNUPkg) and the XNU loader (DarwinBoot) as UEFI modules; the board firmware that runs them on the phone is a Mu-Silicium platform, and upstream Mu-Silicium has no fuxi platform.", "Measured on hardware in matejkoo217/uefi-fuxi: with text offset 0 in the shim's ARM64 header the ABL loads the image and the firmware's DEBUG console prints on the panel; with the firmware address there the ABL answers Load Error.", "The firmware's FdtBlob (sm8550-xiaomi-fuxi.dtb, model 8550 fuxi, msm-id 0x207, board-id 0x10008) carries the root properties the ABL selects an appended DTB by; the DTB merged from OS3.0.309 keeps the base DTB's board-id 0 and is not used for the boot image.", "fuxiPkg Include/RAW.inc listed the vendor raw files SecParti.cfg, uefipil.cfg and QcomChargerCfg.cfg outside the FUXI_VENDOR_HW gate, so the first firmware build in CI (run 41268231266 at 72300f2) stopped at the missing Binaries/nuwa/RawFiles/SecParti.cfg; uefi-fuxi 87554bf9 gates them with their drivers.", "With FUXI_VENDOR_HW = 0 the volume holds UniXNU, UniXNUDxe, DarwinBoot, FuxiBootMemoryDxe, SimpleFbDxe, FAT, PartitionDxe and DiskIoDxe. FuxiGopLogDxe and FuxiDisplayDepexDxe are compiled but enter the volume only with USE_CUSTOM_DISPLAY_DRIVER = 1.", "On the device (2026-11-02, image 931ac958 of run 41273003819): the ABL accepts the v0 image (fastboot boot answers OKAY), the DEBUG firmware log appears on the panel, the UniXNU entry starts DarwinBoot, and DarwinBoot exits boot services and paints its green band. The log ends with SecurityLock LockCapsuleInterface, the normal exit-boot-services message; the DARWINBOOT lines above it are covered by the bands.", "DarwinBoot's hand-off page (photographed on 2026-11-02): kernel va 0xFFFFFFF00427C000 at pa 0x8C007C000 (the start of the 0x8C0000000 run, 2 MiB aligned, plus the kernel's offset in its 2 MiB block), window 0x130000000, video 0xB8000000 1080x2400 with 4320-byte rows at 32 bpp, EL1, PARange 2 (40-bit).", "uefi-fuxi c5793bc2 narrows the high DRAM rows of fuxiPkg to RAM on both the 8 GB unit the map came from and this 12 GB unit: 0x880000000 + 0x39D00000 and 0x8C0000000 + 0x140000000. Nothing from 0x8B9D00000 to 0x8C0000000 is listed, not even the 28 MiB that is RAM on both, because it borders holes that move with the DDR size. The rows stay static: clipping them against the ABL's /memory node would take an FDT parser in the shared SiliciumPkg SEC path. The change reaches 46 of the 54 FVMAIN modules, because SerialPortLib (FrameBufferSerialPortLib) finds its region through MemoryMapHelperLib and so links the table: exactly those 46 differ, and all 5859 changed .text instructions differ in immediates only. Booted on the device (run 41401828450, image m1-touch): no change in behavior.", "The firmware of run 41378843724 (the same code as 627fe52a) hands over a kernel that reaches bsd_init and draws its panic screen on the framebuffer DarwinBoot passes (e901139)."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The high DRAM rows cover the two measured units (8 GB and 12 GB); another unit has to be compared with its /proc/iomem. Reservations after the hand-off are not checked."]
next_action = ["Check the reservations after the hand-off (see memory)."]
evidence = [
  { kind = "source", reference = "https://github.com/OddlyLabs/uefi-fuxi/tree/fuxi", result = "Firmware fork with the fuxi platform" },
  { kind = "device", command = "fastboot boot boot.img", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "ABL Sending OKAY, Booting OKAY (product fuxi, unlocked, slot a); panel: DEBUG firmware log, then the DarwinBoot green band" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (Ubuntu 26.04, clang 21.1.8, uefi-fuxi 87554bf90a6f5707ceeb3720b3dc507de914db94, UniXNU 6ae4c252937ae1920ab68eaded10fc78447e0194)", revision = "72300f2b07ccee230e07caa7b31f5af269b4f942", reference = "https://github.com/OddlyLabs/uefi-fuxi/commit/87554bf90a6f5707ceeb3720b3dc507de914db94", result = "DEBUG SILICIUM_UEFI.fd built at 0x300000 bytes with the UniXNU menu, UniXNUDxe, DarwinBoot and FuxiBootMemoryDxe in the volume" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "DEBUG firmware from uefi-fuxi 87554bf9 built on macOS 26 at 0x300000 bytes (fd_sha256 627fe52af360...) and packed into the boot image" },
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "Firmware log, UniXNU entry, DarwinBoot hand-off (kernel pa 0x8C007C000, window 0x130000000, video 0xB8000000 1080x2400); the kernel reaches bsd_init and its panic screen draws on that framebuffer" },
  { kind = "device", command = "fastboot boot of image m1-touch (SHA-256 be38300f17d03ca1): uefi-fuxi c5793bc2, fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "Firmware with the corrected map: DarwinBoot hands over, the kernel reaches its touch report; no reset" },
]

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["CPU layout and GIC ranges of SM8550 v2 (soc_id 519) from the stock device tree."]
configuration = ["The template ArmCpu and ArmDTPlatform selection."]
procedure = ["Boot to the XNU entry checkpoint and record the enabled CPUs.", "Boot with sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 and fuxi-touch=4 fuxi-touch-panic=2, then read the two SMP rows of the touch report (package/FuxiTouchProbe.cpp smpText): per secondary core the ArmCpu step (7 = running), failure code and CPU_ON result, the scheduler's processor count, and the timer interrupts and IPIs each core took."]
findings = ["On the device the boot CPU runs the XNU entry with the MMU off (blue band) and reaches the instruction before the MMU enable (magenta band). The image has no reset probe, so nothing marks later progress; no XNU console text and no panic screen appear, and the phone stays off USB. The stop therefore lies between the MMU enable and PE_init_printf in arm_init, the first point that can draw (xnu d8b80295 arm_init order: Apple register setup, DT init, ml_parse_cpu_topology, thread and CPU bootstrap, arm_vm_init, serial_init, PE_create_console, PE_init_printf).", "Entry-probe resets located the stop (2026-11-02): the kernel reaches the MMU enable, arm_init, cpu_data_init, PE_init_platform and configure_misc_apple_regs, and never returns from ml_parse_cpu_topology. The ADT gives cpu0-2 cluster-type E and cpu3-7 P (dts/fuxi.dts, copied from sheng), so the parser builds two clusters, while BCM2837 keeps MAX_CPU_CLUSTERS 1 (sm8550-common raises only MAX_CPUS to 8); the DEVELOPMENT kernel asserts cluster_id < MAX_CPU_CLUSTERS and panics before any console exists. UniXNU-sheng carries the fix as its board patch zzyf-sheng-amp.patch (__ARM_AMP__, MAX_CPU_CLUSTERS 2, Edge scheduler defaults without a performance controller); fuxi now carries it unchanged.", "With the AMP patch (65c4f4e) the reset probes after ml_parse_cpu_topology, thread_bootstrap, cpu_bootstrap, rtclock_early_init, kernel_startup_bootstrap, timer_call_init, cpu_init, processor_bootstrap, arm_vm_init, serial_init, kernel_startup_initialize_upto and PE_create_console all rebooted the phone. The probe after PE_init_printf, the next call, did not (one run), and the official image stayed on the bands with no kernel text and no panic screen. The cause was PE_create_console's access to the Raspberry Pi panic log address (see memory): with CONFIG_XNU_DT_PANIC_REGION and no other kernel change (e901139) the boot reaches bsd_init. Why the probe after PE_create_console still reset is not explained; an asynchronous fault would fit.", "On e901139 the boot CPU runs arm_init to machine_startup and on to bsd_init. Kernel threads, IOSleep, IOMalloc and IODeviceMemory mappings work: the touch probe uses them, and its panic frames are touchThread and Call_continuation. Only the boot CPU runs: sheng-smp is not set, so ArmCpu does not start the other seven cores.", "With the PMGR bridge (484a650) the boot CPU keeps running past bsd_init: image p1-pmgr ends in the root device wait, and in p3-poll the touch thread's sleeps and SPI transfers ran 3531 times before the tap.", "Two community fuxi kernels get past this point on the same SoC with the same dram-size and window size: mouse233 (iPadOS 17.7.11, own firmware with a USB RAM receiver) and Kerfand (iOS 16.7.16, the same payload-in-image layout). Both build the sheng kit; this board builds the template components ArmDTPlatform and ArmCpu.", "The payload's ADT (image m1-touch) has what CPU_ON needs: eight cpu nodes with reg 0x000 to 0x700 (MPIDR affinity), cpu0 running and cpu1-7 waiting, three cortex-a510 in cluster E and two cortex-a715, two cortex-a710 and one cortex-x3 in cluster P; /psci has method smc. UniXNU-sheng boots the same SoC with sheng-smp=1 armcpu-spi-ipi=1. No screen showed ArmCpu's secondary-core variables until the SMP rows of the touch report, so an image with only the arguments changed shows whether the boot survives, not which cores run.", "Device (680a818, images s2-smp and s3-selfipi): with sheng-smp=1 armcpu-spi-ipi=1 all seven secondary cores start. CPU_ON over smc returns 0 for each, each core enters initCPU with its own MPIDR, finds its redistributor and runs (step 7), the scheduler counts eight processors (processor_avail_count 8), and the probe's thread reported from core 3 and from core 4.", "Without armcpu-self-ipi=1 the kernel sends no IPI at all (s2-smp: 0 sent, 0 taken): xnu-10063 starts every core with SIGPdisabled in cpu_signal, cpu_signal_internal skips a core while it is set, and only a handled IPI clears it. With armcpu-self-ipi=1 each core sends itself one IPI from initCPU, the self-IPI XNU expects from PE_cpu_machine_init (comment in osfmk/kern/machine.c), and IPIs go through (s3-selfipi: 85 sent, every core took its own, cores 3 and 4 took 28 and 51). Cores 1 and 2 (cluster E) took no timer interrupt in either boot, and core 6 none in s3-selfipi.", "SGIs do not arrive on fuxi (2026-11-03, image h3-sgi): without armcpu-spi-ipi=1 the eight self-IPIs went out through ICC_SGI1R_EL1 and none was taken (ipi8/0), as UniXNU-sheng records for sheng, so armcpu-spi-ipi=1 is required.", "One boot of six with sheng-smp=1 (image h2-edge, by the order of the photographs) started no secondary core: CPU_ON returned 0 for all seven, none entered initCPU, and the scheduler ran on core 0 alone. armcpu-edge=1 is read only after processor_start returns, so it cannot hold a core before initCPU; the cause is unknown.", "Two more SMP boots (11db5c0, h4-hid and h5-edge) started all seven cores, so they failed to start once in nine boots. armcpu-edge=1 did not put work on cores 1 and 2 in a probe boot; with user space running (r3-ramblock) core 1 took timer interrupts and IPIs reached every core."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs are not recorded in dts/fuxi.dts beyond the SoC DTSI.", "Cores 1 and 2 have not been seen taking a timer interrupt. The SMP boots end in the probe's panic within about a minute, so longer SMP runs are not tested. In one boot of nine no secondary core reached initCPU after a successful CPU_ON."]
next_action = ["Record whether the secondary cores fail to start again; armcpu-edge=1 (h5-edge) changed nothing for cores 1 and 2. Find out whether cores 1 and 2 ever run work (board.toml passes sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 since the HID change); armcpu-edge=1 makes ArmCpu call ml_cpu_init_completed, so the Edge scheduler sets up its cluster matrix."]
evidence = [
  { kind = "device", command = "fastboot boot boot.img", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "Blue band (XNU entry, MMU off) and magenta band (before the MMU enable) appear; nothing after them" },
  { kind = "device", command = "fastboot boot of entry-probe reset images (local payloads from the run 41363175206 kernel, firmware 627fe52a)", revision = "12f9f38d63e4642d335583e159603cfcea2c3744", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41363175206", result = "Reset 6 s after the MMU enable and after arm_set_kernel_tbi, cpu_data_init, PE_init_platform and configure_misc_apple_regs in arm_init (the phone rebooted to the system each time); no reset after ml_parse_cpu_topology, processor_bootstrap, set_mmu_ttb or arm_vm_init" },
  { kind = "device", command = "fastboot boot of entry-probe reset images and of the official image (run 41372182658, AMP patch)", revision = "65c4f4e4c59f08e81b6790fe75d4c3eaaf04e794", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41372182658", result = "Reset after ml_parse_cpu_topology through PE_create_console (12 images); no reset after PE_init_printf (one run); official image: panel photograph shows the three bands and the end of the firmware log, no kernel text, no panic screen, no USB device for 5 min" },
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "The boot CPU reaches bsd_init; the touch probe's kernel thread runs and panics with its report (frames touchThread, Call_continuation)" },
  { kind = "device", command = "fastboot boot of image s1-smp (SHA-256 281e450dddc9dea5): sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "The boot survives with the secondary cores started: touch report as before (rows 1 to 3 and frames as in m1-touch), no reset in 240 s; free pages 383 below m1-touch" },
  { kind = "device", command = "fastboot boot of image s2-smp (SHA-256 6ca28d294bb2b318): sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "680a818ff5efbd920d03dbedd87963d5c6116fbc", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 c1 b0 cpu3 av8 st7777777 f0000000 psci0,0,0,0,0,0,0 ipi0/0; timer interrupts per core 76/0/0/677/679/226/200/228, no IPI on any core" },
  { kind = "device", command = "fastboot boot of image s3-selfipi (SHA-256 ff832779a415c262): sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "680a818ff5efbd920d03dbedd87963d5c6116fbc", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 c1 b0 cpu4 av8 st7777777 f0000000 psci0,0,0,0,0,0,0 ipi85/84; timer interrupts per core 76/0/0/2006/6/5/0/2, IPIs per core 1/1/1/28/51/1/1/1" },
  { kind = "device", command = "fastboot boot of image h2-edge (SHA-256 65d0dbc3039bec62): sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2 armcpu-edge=1", revision = "22579b483fd9f982aef8883f14932208a7953700", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run0 av1 st4444444 psci0,0,0,0,0,0,0 ipi1/1: CPU_ON succeeded for all seven cores and none entered initCPU" },
  { kind = "device", command = "fastboot boot of image h3-sgi (SHA-256 b7064ed8aff71697): sheng-smp=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2", revision = "22579b483fd9f982aef8883f14932208a7953700", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 av8 st7777777 ipi8/0, IPIs per core all 0: the self-IPIs sent as SGIs never arrived" },
  { kind = "device", command = "fastboot boot of image h5-edge (SHA-256 c2a3653351ae6384): fuxi-touch=4 fuxi-touch-hid=1 sheng-touch-hid=1 fuxi-touch-panic=2 armcpu-edge=1", revision = "11db5c00e84246681b9c9c06582d4eb31fb6ae26", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 av8 st7777777; timer interrupts per core 73/0/0/2031/11/12/4/2: cores 1 and 2 idle; HID rep40/0" },
