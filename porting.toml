schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi). Board files from the UniXNU device template, the FTM5 touch driver and its staged kernel probe; CI builds the kernel, the payload, the DEBUG firmware and the fastboot boot image. On 2026-11-02 the image boots on the device to bsd_init (e901139), and the touch probe's stage 3 reads the controller's chip id 36 40 there. With the PMGR bridge (484a650) the kernel runs on to the root device wait, and stage 4 reports real touches, with polling and with the interrupt."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "LICENSE", "scripts/*boot-progress*", "package/*BootProgress*", "package/*Watchdog*"]
inputs = ["UniXNU examples/device template (SM8550, iPadOS 17.7.11 profile).", "UniXNU-sm8550-common at 23b2049fcd9e30356161def84231334fb55ecca9."]
configuration = ["board.toml: name fuxi, kit fuxi, soc_source sm8550, os_profile ipados-17.7.11-21H461, device_tree.source device:dts/fuxi.dts.", "configs/fuxi_defconfig: the template options, CONFIG_XNU_NATIVE_ADRENO off (the SoC fragment turns it on), and CONFIG_XNU_EXTRA_LD_ARCHIVES for the touch archive and the force-loaded HID archive. The arch fragment sets CONFIG_XNU_BUILD_ARCHIVES, CONFIG_XNU_NATIVE_AES, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN; the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS.", "[kernel] archives in build order: corecrypto (plain and namespaced), ArmDTPlatform, ArmCpu, SoftwareAES and its bindings, libpthread, the mockfs fixture, build-fuxi-platform-power.py, build-fuxi-hid-input.py, build-fuxi-ram-block.py, build-fuxi-touch.py."]
procedure = ["./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi", "./unixnu status --json", "./unixnu build kernel"]
findings = ["CI (.github/workflows/build.yml) pins OddlyLabs/UniXNU and OddlyLabs/uefi-fuxi at full revisions; after merging upstream into either fork, update UNIXNU_REF or UEFI_REF and let the image job run again.", "The image job installs Homebrew's openssl@3 itself rather than relying on the runner image: the encryption step uses OpenSSL 3 (PBKDF2 for the image, RSA-OAEP with SHA-256 for its key).", "configs/fuxi_defconfig sets CONFIG_XNU_DT_PANIC_REGION. The template and the arch, SoC and OS fragments leave it off, and then the BCM2837 target uses its fixed panic log address (see memory); every other SM8550 defconfig in reach (UniXNU-sheng, Kerfand, MinecraftVM) sets it. On the device the kernel with it passes PE_create_console and reaches bsd_init (evidence/2026-11-02-first-boot.md). The kernel check of the image job fails if PE_create_console mentions 0x3c0f.", "CI pins uefi-fuxi c5793bc2 since the memory map fix for this 12 GB unit (see firmware and memory).", "configs/fuxi_defconfig sets CONFIG_XNU_SHENG_PMGR and board.toml adds build-fuxi-platform-power.py to the archives and sheng-pmgr=2 to the boot arguments, as UniXNU-sheng and the community fuxi ports do: AMFI needs an ApplePMGRNub (see power).", "The image job also uploads the unpatched prelinked kernel (gzip) and payload.json, the kernel encrypted with the image key, so payload variants such as entry-probe images are built without macOS.", "The host tests byte-compile scripts/*.py and ci/*.py and parse ci/decrypt-boot-image.sh with bash -n, so the image tools are checked on every push.", "The merged configuration is the arch, SoC and OS fragments followed by the defconfig; the archive list has to cover every archive the merged options require, not only those of the template defconfig.", "CONFIG_XNU_SOURCE_MOCKFS (OS fragment) makes vfs_conf.o reference mockfs, so the link needs build/mockfs-fixture/libmockfs_fixture.a: the first CI kernel build at 450f518 applied all 62 patches and built every listed archive, then stopped at that missing archive.", "ArmCpu needs the source corecrypto provider, so corecrypto is built before the components, as in UniXNU-sheng.", "board.toml's kernel_args start the secondary cores (sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1, the arguments of image s3-selfipi) and run the touch probe to stage 4 with the HID digitizer (fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2), so the CI image waits for a touch and otherwise ends in the root device wait.", "fuxi_defconfig sets CONFIG_XNU_NATIVE_RAM_BLOCK=y. Without CONFIG_XNU_SOURCE_STORAGE the kernel build script requires CONFIG_XNU_NATIVE_AES (set by the arch fragment) and force-loads build/ram-block/libRamBlock.a; the owner Data code of patches/xnu/offline-owner-systemos-mount.patch stays out, since CONFIG_XNU_OWNER_DATA_MOUNT is not set.", "board.toml's kernel_args add sheng-touch-hid=1, which NativeHidInput reads to give its default device the digitizer collection.", "board.toml selects the native UFS root (2026-11-04): a [userdata] section with the GPT-verified span (first LBA 3110976, last LBA 61850618, 4096-byte LBAs; see storage), the ShengUfs and VerifiedRoot components, the component:ShengUfs kernel archive and native-ufs-root=1 in kernel_args; configs/fuxi_defconfig sets CONFIG_XNU_NATIVE_UFS=y and the four verified-root options of UniXNU-sheng. ./unixnu status --json reports the merged configuration with both components.", "Build #10 (2026-11-04) failed at the owner-root trust guard in UniXNU scripts/build-xnu-4k-baseline.sh: CONFIG_XNU_OWNER_ROOT_TRUST=y requires CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y or CONFIG_XNU_SOURCE_STORAGE=y, and the first UFS wiring copied only the verified-root lines from UniXNU-sheng configs/sheng_defconfig without the virtio line. board.toml now includes the VirtioMmioBlock component and its archive, and fuxi_defconfig sets CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y, mirroring sheng iPadOS 17 (the build script force-loads the component archive at build/virtio-mmio-block/libVirtioMmioBlock.a by default).", "Build #11 (2026-11-04) passed that guard but failed to link: CONFIG_XNU_VERIFIED_ROOT_ARCHIVE pointed at sheng bundle path build/verified-root-os-xnu-bundle/libVerifiedRootProbe.a, which no fuxi build step produces. The probe archive is signed out of an owner-policy pipeline (UniXNU scripts/build-owner-os-policy.py and build-verified-root-probe.py) frozen to sheng board values (its root UUID 04769D26, its image digests, macOS hdiutil attach state), with no fuxi counterpart yet. Decision (owner, 2026-11-04): the first UFS boot drops the owner-root chain — fuxi_defconfig no longer sets CONFIG_XNU_VERIFIED_ROOT_PROBE, CONFIG_XNU_OWNER_ROOT_AUDIT, CONFIG_XNU_OWNER_ROOT_TRUST or the archive override — and relies on the driver manifest hash verification; the chain is ported as its own step after the root boots.", "Build #12 (2026-11-04) then failed on the bindings audit the VIRTIO_BLOCK symbol enables (build/virtio-mmio-block/bindings.json is produced only by the original-storage bindings generator, which this board does not run), and source inspection showed the simplified route cannot link at all: UniXNU build-arm-driver.py compiles NativeUfs.cpp unconditionally with -DNATIVE_VERIFIED_BLOCK=1, whose policy data symbols only the sheng owner-policy pipeline generates. Route taken (owner decision, 2026-11-04): the ShengUfs, VerifiedRoot and VirtioMmioBlock components are deselected, CONFIG_XNU_NATIVE_VIRTIO_BLOCK is removed, the driver sources are vendored unmodified in kits/fuxi/ufs/ (UniXNU/ShengUfs, BSD-2-Clause) and built device-side by scripts/build-fuxi-ufs.py without the verified define, output at the fixed build/sheng-ufs/libShengUfs.a path the kernel script force-loads under CONFIG_XNU_NATIVE_UFS=y.", "board.toml [payload.adt] sets root_match_volume_uuid = \\\"04769D26-2CA0-4825-B443-E2E5F88300F2\\\" (2026-11-05, corrected the same day): devicetree.py turns it into the ADT /chosen root-matching property (IOMedia by UUID) that IOFindBSDRoot matches, the root selection UniXNU-sheng uses for this OS profile. The value is the OS image's System volume UUID: it occurs 17 times in the decoded OS image, and it is identical to sheng's value because the image is byte-identical. The value first recorded here, 10F30600-0000-0000-0476-9D262CA04825, was a misread extraction (an 8-byte prefix glued onto the real UUID's first half) and every later byte check searched for the wrong string and found it; it occurs only as the 8 bytes before three of the real UUID's occurrences. Device proof of the correction: an image carrying the wrong value (Build #31 kernel) still ended in the root device wait ('Failed to mount root device', IOKitBSDInit.cpp), while the corrected image (ufs-boot-pubfix2) found the root by matching, mounted the APFS System volume and advanced to the sealed-root authentication check in bsd_init (see storage).", "Owner-root trust chain ported (owner decision 2026-11-05, reversing the 2026-11-04 first-boot simplification recorded above): the pubfix2 device boot proved the chain load-bearing - with publication and root matching fixed the kernel mounted the UFS root and panicked 'rootvp not authenticated after mounting' (bsd_init.c), and on a non-macOS target that FSIOC_KERNEL_ROOTAUTH check has no pass other than the owner authorization of patches/xnu-12377/offline-owner-root-binding-audit.patch. fuxi_defconfig again sets CONFIG_XNU_VERIFIED_ROOT_PROBE, CONFIG_XNU_OWNER_ROOT_AUDIT, CONFIG_XNU_OWNER_ROOT_TRUST and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE (the two-volume bundle path), plus CONFIG_XNU_NATIVE_VIRTIO_BLOCK for the build script's guard; board.toml selects the VirtioMmioBlock and VerifiedRoot components and adds component:VirtioMmioBlock and build-virtio-mmio-bindings.py to the archives (the step whose absence failed Build #12). The earlier reading that the policy pipeline is frozen to the sheng board was wrong: its constants (the OS volume UUID above, the IPSW member and image digests) are this iPadOS 17.7.11 image's own, so scripts/build-fuxi-owner-root.py runs the pipeline in the build with a per-build owner keypair and produces the bundle archive before the kernel link (see storage).", "Push encoding incident (2026-11-05): the trust-chain pushes f0c230ea and b79c9ee4 sent every file's content base64-encoded to a push tool that stores content raw, so all six files landed as base64 text and Builds #32/#33 and Device documentation #32/#33 failed in seconds (Host tests py_compile on the base64 first line of scripts/build-fuxi-ufs.py). The change set was re-pushed raw as 7aed4d87 and ec981af2 and every file was read back and byte-compared against the local tree. Device documentation #34/#35 still failed afterwards with a TOML parse error at line 1, column 83512: the checker parses the BASE revision's porting.toml to diff changed areas, and the base of those runs was still the base64-corrupted file - the error is in the comparison base, not in the current record (reproduced locally with the corrupted file as base). The check self-heals on the first push whose base carries a valid porting.toml; this finding is that push's record.", "Board archives correction (2026-11-05): the VirtioMmioBlock bindings entry now names the device script scripts/build-fuxi-virtio-bindings.py instead of UniXNU's build-virtio-mmio-bindings.py. The upstream script consumes build/storage-abi/interface-audit.json, a maintainer research record no build step produces, so the entry could never succeed in a fresh CI tree; the device script binds from the recorded ABI data in scripts/fuxi_storage_abi.py, the same source the RAM block bindings use (see storage). This configuration finding is the record the checker requires for the board.toml change itself - the Build #36 storage finding alone did not cover it, and Device documentation #37 failed on exactly that.", "Boot progress enabled (2026-11-05): CONFIG_XNU_BOOT_PROGRESS=y. The baseline builds libBootProgress.a itself when the option is on (it requires the native UFS + owner-root audit + source corecrypto configuration, which this board now has) and the zzz-boot-progress patch then declares boot_progress_poll as a real function; with the option off the same declaration collapses to a no-op macro for kernel sources, but the verified UFS driver - compiled outside that patch's reach - references the real symbol (Build #39's link). Sheng's defconfig enables the same option.", "Build #40 (2026-11-05, 852979ca) failed in Build kernel at build-xnu-4k-baseline.sh line 90: with the option on the baseline runs python3 scripts/build-boot-progress.py, but no tree in this line carries that script - not the board repo, not OddlyLabs/UniXNU at 6ae4c252, not upstream UniXNU - so enabling the option without its builder broke the build before the archives. The board now ships scripts/build-boot-progress.py, which compiles package/FuxiBootProgress.c against the bootstrap's startup.o compile record into build/boot-progress/libBootProgress.a, the archive the baseline force-loads. The source defines the thirteen boot_progress_* entry points of patches/xnu/zzz-boot-progress.patch's kern/boot_progress.h as weak no-ops (boot_progress_active returns 0, so console output keeps using the real console); the verified UFS driver needs only boot_progress_poll, the other twelve are the patch's call sites in arm_init, startup, the video and serial consoles, pe_kprintf, bsd_init, kern_exec, sleh and kern_exit. Sheng's full monitor (package/BootProgress.c with framebuffer rendering, a process census, a watchdog policy and a diag export) is not ported: this kernel has no working display path yet, and the observer's only load-bearing job here is satisfying the link. Sheng's own build-boot-progress.py is not reusable either - it compiles sheng-only kit sources (BootFaultProbe, BootWatchdogPolicy, BootDiagExport, AdspFirmware) that have no fuxi counterpart.", "System trust bundle wired into the payload (2026-11-05): board.toml [payload] pins trust_cache_sha256 to upstream's two-module original bundle (7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7), and the Build workflow gains a 'Build system trust bundle' step before 'Build payload' and passes --trust-cache to the payload step. Build #41's payload carried no trust cache at all (payload.json trust_cache_sha256 was null), so AMFI had no CDHash for the full-system /sbin/launchd and the kernel killed it at exec with OS_REASON_EXEC / EXEC_EXIT_REASON_SECURITY_POLICY (device photo 2026-11-05 ~15:44 CST). No kernel or defconfig change in this step.", "Build #43 (2026-11-05, 0493551c) failed before the payload ran: the 'Build payload' step was written as a YAML plain scalar (run: without |), so the line break folded to a space and the trailing backslash became a stray single-space argument, and the driver's argument parser rejected the command with exit code 2 ('unrecognized arguments: --trust-cache ...'). The 'Build system trust bundle' step had already succeeded on the same run (bundle 61,356 bytes, sha256 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7, matching the pin), so the failure was the workflow's line folding, not the bundle or the driver - the same driver at UniXNU 6ae4c252 accepts --trust-cache, verified locally with the exact argument shape. The step is now a block scalar (run: |), the shape every other multi-line step in this file already uses. The Device documentation run for the same head failed too: its checker diffs the push's base (4f4a0692) against HEAD, and that diff held only build.yml while this area's trust-bundle finding sat in the base commit, so it demanded a configuration finding update; this finding is that update, pushed after the workflow fix so the final head's docs diff holds porting.toml only.", "Owner cache mount enabled (2026-11-05): CONFIG_XNU_OWNER_CACHE_MOUNT=y, CONFIG_XNU_OWNER_CACHE_STARTUP=y and CONFIG_XNU_OWNER_UNION_SYSTEMOS=y. The chain45 device boot passed the trust-cache gate - launchd exec'd and dyld started - then initproc failed with OS_REASON_DYLD (namespace 6), 'no dyld cache': the SystemOS (cryptex) volume was published by the UFS driver but never mounted, because the offline-owner-systemos-mount patch's code is gated by these options and was not compiled in at all (zero native_owner_cache strings in the Build #45 kernel). With the trio on, the kernel mounts the SystemOS volume - found by UUID through the verified-block layer; the baseline's generated header defaults that UUID to this image's SystemOS volume 8846FE78-2910-4297-AF97-D59BB6F8FC16 - as the upper union layer over / before exec'ing initproc, so dyld finds the shared cache at its standard path. This mirrors sheng_defconfig; upstream's union checkpoints assert native_owner_cache_stage==6 with status==0. OWNER_BOOT_MANIFEST and OWNER_DATA_MOUNT stay off (Data-volume stage).", "Build #46 (2026-11-05, c6b4a853; Build run 42018757736, Device documentation run 42018757700) succeeded on the first configuration with the owner cache trio in fuxi_defconfig (OWNER_CACHE_MOUNT, OWNER_CACHE_STARTUP, OWNER_UNION_SYSTEMOS). Host result only: the device check is the chain46 boot, and the kernel-marker verification runs with its assembly.", "Scratch Data stage enabled (2026-11-05, owner plan A - the whole step): CONFIG_XNU_OWNER_BOOT_MANIFEST=y, CONFIG_XNU_OWNER_DATA_MOUNT=y and CONFIG_XNU_OWNER_DATA_VOLUME_UUID=\"18AB5557-DC2D-469B-8758-855E60F5B0DF\" in fuxi_defconfig. This supersedes two statements above: the RAM-block finding's 'the owner Data code stays out, since CONFIG_XNU_OWNER_DATA_MOUNT is not set' and the cache-mount finding's 'OWNER_BOOT_MANIFEST and OWNER_DATA_MOUNT stay off'. The trigger is the chain46 device result: that boot reached the terminal state UniXNU's scripts/check-original-launchd-main-checkpoints.py asserts as the qualified endpoint of the original-launchd run (launchd reaches LC_MAIN with genuine AMFI/Sandbox; the run ends at the POSIX_SPAWN_PANIC_ON_EXIT report 'mount[3] exited', signal 0, exit status 66, which the checker pins as the mount child's normal exit), so the dyld-cache gate is closed and the open stage is a writable Data volume. BOOT_MANIFEST is the data mount's own guard (offline-owner-systemos-mount.patch #errors without it) and itself requires OWNER_CACHE_STARTUP (already on); it also makes the cache prepare publish the boot manifest. With DATA_MOUNT on, load_init_program runs native_owner_data_prepare after the cache prepare and before exec'ing launchd, and any failure panics 'offline scratch Data mount failed'. The baseline emits the XNU_OWNER_DATA_VOLUME_UUID header only when DATA_MOUNT and NATIVE_RAM_BLOCK are both on (both are), taking the value from this defconfig string option. The UUID is the one upstream pins (scripts/build-cpu-desktop-kernel.py sets it for its desktop kernel; its RAM-data checkpoints require the published IOMedia UUID to equal it), and sheng_defconfig carries the same three settings with the same value; guowenye's raphael line enables the same BOOT_MANIFEST + DATA_MOUNT pair independently. The Build workflow gains a 'Build Data seed' step before 'Build payload', passes --data-ramdisk to the payload step and copies the seed into the encrypted artifact set (see storage for the seed, packaging for the payload wiring). No board.toml or VERIFIED_ROOT_ARCHIVE change: on this baseline the data mount needs no WithData archive (see storage).", "Data-seed workflow wiring landed in two web-editor commits (2026-11-05): 5f0cfb2 added the 'Build Data seed' step, the payload step's --data-ramdisk and the encryption step's data-seed.cdr copy - but committed the new step at 4-space indentation (every other step in the file uses 6) and left a stray trailing backslash on the Build firmware step's run line, which made build.yml invalid YAML (a parser rejects the file at the misindented step). The byte-for-byte read-back of the committed file caught both defects; the edit's own report had shown the step with normalized indentation. 2112d52 re-indented the step and removed the backslash; the file at that head is byte-identical to the intended content and parses. Both web commits' own diffs hold only build.yml, so their Device documentation runs fail for exactly the recorded reason - the configuration finding a workflow change requires cannot sit in a commit the GitHub App cannot write - and this records-only commit is the fix, the same shape as 3a90e9c + 8375915e. The runs that count are the final head's.", "Build #51 (2026-11-05, 97863f09; Build run 42032688982, 13m18s; Device documentation #51 succeeded) failed at the kernel link with exactly one undefined symbol, _sheng_boot_watchdog_policy, referenced from _load_init_program in kern_exec.o (job log 9_Build kernel.txt, read directly from the downloaded log archive; all 16 archives passed). The call site is patches/xnu-12377/zzz-boot-progress.patch: inside load_init_program, under XNU_OWNER_DATA_MOUNT and XNU_BOOT_PROGRESS, it calls sheng_boot_watchdog_policy(p, scratch_addr) and panics on a non-zero return. With DATA_MOUNT off (Build #46) the whole block compiled out, so the missing definition was latent until the Data stage flipped DATA_MOUNT on. The definition lives only in sheng's line (UniXNU-sheng package/BootWatchdogPolicy.c), not in OddlyLabs/UniXNU at 6ae4c252 or this repo. The fix ports it as package/BootWatchdogPolicy.c and extends scripts/build-boot-progress.py to compile it from the bootstrap pass's kern_exec.o record (the BSD-side record, as the policy uses BSD syscalls; sheng's own builder does the same) into libBootProgress.a, asserting the symbol is defined so a missing policy fails in the builder instead of at the link. With this board's kernel_args the policy finds no sheng-disable-*, sheng-lite or setup switch and returns 0, so the Data mount proceeds unchanged. Sheng's PE_builtin_boot_args[] is deliberately NOT ported: it is that board's always-on switches and would take effect on every boot, including sheng-disable-jobs=com.apple.cameracaptured, which would make the policy write a disabled.plist for the camera daemon - an unapproved behavior change; fuxi's kernel arguments live in board.toml [payload]. This supersedes the Build #40 finding's 'BootWatchdogPolicy ... no fuxi counterpart' sentence.", "Data seed formatting moved to a macOS 14 job (2026-11-06; the build.yml change landed through the GitHub web editor as commit d240007b, because the GitHub App cannot write workflow files, and the committed file was read back and byte-compared against the intended tree copy: 16,873 bytes, identical): a new data-seed job on macos-14 runs scripts/build-fuxi-data-seed.py --from-ipsw and uploads the seed as the artifact fuxi-data-seed-<run_attempt>; the image job now needs [host-tests, data-seed] and fetches that artifact with actions/download-artifact pinned at 37930b1c2abaa49bbe596cd826c3c89aef350131 (v7.0.0) in place of building the seed inline on macos-26. Reason: chain47 and chain48 both hung on the device with a pure black screen in the Data stage, and chain48 exonerated the seed's incompatible-feature word (its only functional delta), leaving the formatter generation as the prime suspect - the seed was written by macOS 26's newfs_apfs 2811 while the mounting iPadOS 17.7 APFS is the 2142 generation, and macos-14's newfs_apfs is that same 2142 generation. The payload and encryption steps are unchanged and consume the fetched seed at the same path. Verification image: chain49.", "Data seed job moved from macOS 14 to macOS 15 (2026-11-06, owner decision A'; the build.yml change landed through the GitHub web editor as commit 09d2256, because the GitHub App cannot write workflow files, and the committed file was read back and byte-compared against the intended tree copy: 17,025 bytes, identical): GitHub retired the macOS 14 hosted runner images on 2026-11-02, four days before the macOS 14 job was added, so Build #57's data-seed job was cancelled at runner assignment on both attempts (the job page reports: The configuration 'macos-14-arm64-us-default' is not supported) and that job never built a seed. The owner's bench Mac is not on Sonoma either (macOS 15.7.8, checked 2026-11-06), so a 2142-exact seed now waits on a local Sonoma VM and is used only if a later re-plan points back at the formatter generation. macOS 15's newfs_apfs (the 2313-2332 generation) is the closest supported formatter to the IPSW volumes' own 2142: if its seed boots, the Data stage closes without the 2142-exact test; if the device still hangs black, the formatter generation is largely exonerated and the Data stage is re-planned (seed content provenance, the 256 MiB seed size, the mount path itself). The payload and encryption steps are unchanged and consume the fetched seed at the same path. Verification image: chain49.", "Data seed delivery switched to the packed form (2026-11-06): board.toml [payload.adt] sets packed_data_ramdisk = true, so the ADT reserves /chosen/memory-map/PackedRAMDisk and DarwinBoot validates the seed's DBRDISK1 extent table and copies only its nonzero extents (about 1 MiB), instead of copying the whole 256 MiB dense image into the owned window; [payload] size_mib returns 512 to 192, the pre-Data value, since the packed seed file is about 1 MiB and the payload files total about 127 MiB. Device evidence (2026-11-06): every image whose payload carried the dense seed booted to a pure black screen with no kernel text - chain47, chain48, chain49 and disc1, a discriminator that paired chain46's known-good kernel (native_owner_data strings: 0) with chain49's seed-carrying payload - while chain50, identical to chain49 except for the packed delivery and the 192 MiB volume, booted normally past the chain46 terminal state with the Data stage live (see storage). The kernel, the seed's bytes and the defconfig are unchanged by this step; the data-seed job's packing step is the following workflow commit (configuration finding there).", "Data-seed packing wired into the workflow (2026-11-06; this build.yml change landed through the GitHub web editor as a whole-file upload as commit dbd74894, because the GitHub App cannot write workflow files, and the committed file was read back and byte-compared against the intended tree copy: 17,516 bytes, sha256 fab8bf64da32fc39b2acfafd89067179c88be5213eb5d8ffbf5f2c3c6da88404, identical): the data-seed job gains a 'Pack the Data seed' step that runs scripts/pack-fuxi-data-seed.py on the built owner-data.cdr, and its artifact gains owner-data.dbr beside the .cdr and seed.json; the image job's payload step now passes owner-data.dbr to --data-ramdisk in place of the dense .cdr, and the encryption step copies data-seed.dbr and its sha256 into the encrypted artifact set beside the retained data-seed.cdr. With board.toml's packed_data_ramdisk (c1de01de), a CI payload now emits the PackedRAMDisk placeholder for the packed file, so an image assembled locally from CI artifacts carries the same configuration chain50 device-verified. This records-only commit carries the finding for that workflow commit; the workflow commit's own Device documentation run fails for the recorded reason - the configuration finding a workflow change requires cannot sit in a commit the GitHub App cannot write.", "Data-seed grow step wired into the workflow (2026-11-06; this build.yml change landed through the GitHub web editor as a whole-file upload as commit f546cdc1, because the GitHub App cannot write workflow files, and the committed file was read back and byte-compared against the intended tree copy: 17,790 bytes, sha256 5c7798180821a8c2b1fa5b886b9c838db4bbfa7f810b96e13796a734d28698a6, identical): the data-seed job gains a 'Grow the Data seed' step that runs scripts/grow-fuxi-data-seed.py --gib 213 on the packed owner-data.dbr, and its artifact gains owner-data-grown.dbr beside the .cdr, the .dbr and seed.json. The payload still consumes the 256 MiB owner-data.dbr, so no boot behaviour changes; the grown seed is phase A's host-verification artifact, and the payload switches to it only with phase B's persist boot argument. This records-only commit carries the finding for that workflow commit; the workflow commit's own Device documentation run fails for the recorded reason - the configuration finding a workflow change requires cannot sit in a commit the GitHub App cannot write.", "Persistent Data phase B wiring (2026-11-06): board.toml kernel_args add sheng-data-persist=1 and sheng-log-reserve=1024. The ShengUfs driver's native_ufs_store_mode() reads the persist argument (package/FuxiRamBlockStore.cpp documents that the board not setting it is the only reason the store reports mode 0 today); mode 1 attaches NativeRamBlock's store window read-only (the overlay opens with mode == 1 and no page is written to the medium). sheng-log-reserve pins the 1024 MiB reserve the phase A grow arithmetic assumed, the driver's own default, written out so the window sizing has one visible source. package/FuxiBootProgress.c gains the stage's only observability: its boot_progress_exit (a weak no-op until now, like the other twelve entry points) prints the NativeRamBlock persist counters once, on the first process exit, in UniXNU-sheng's BootProgress.c row formats (st/hdr/gpt before-after/first LBA, then present/loaded/writes/syncs/errors), declaring the counters as weak imports exactly as sheng's monitor does. The counters have no header anywhere and no renderer on this board reads them, and the attach's own IOLog lines scroll off before the exit report, so without this row a persist=1 boot is photographically indistinguishable from a volatile one. NativeRamBlock.cpp itself is untouched (an unchanged copy of UniXNU RamBlock 4be2d7e). The payload's switch to the grown seed is the following workflow commit (configuration finding there); persist=2 stays gated on the owner's separate approval (phase C, see storage).", "Payload consumes the grown Data seed (2026-11-06; this build.yml change landed through the GitHub web editor as a whole-file upload as commit b28ceac9, because the GitHub App cannot write workflow files, and the committed file was read back and byte-compared against the intended tree copy: 17,796 bytes, sha256 6eabb10697ba2a88550983e41f8614006b57c3546194f6bc6ce8408d31806e29, identical): the payload step's --data-ramdisk now passes owner-data-grown.dbr - the 213 GiB grown seed the data-seed job has produced since phase A - in place of the 256 MiB owner-data.dbr. With board.toml's sheng-data-persist=1 (the phase B wiring finding above) the kernel now attaches the store window against this seed in read-only probe mode; the packed delivery and the 192 MiB payload volume are unchanged, as the grown .dbr is about 1.1 MiB. This records-only commit carries the finding for that workflow commit; the workflow commit's own Device documentation run fails for the recorded reason - the configuration finding a workflow change requires cannot sit in a commit the GitHub App cannot write.", "2026-11-06: chain52 (Build #70 attempt 2, head 5fbe92ad) booted normally on device with sheng-data-persist=1 - watchdogd[150] exit report, pages=0x1229cb - but the two fuxi persist rows were not in the photograph: they printed once at the first process exit and scrolled off. chain53 (Build #72, head 9212cccc) printed the rows on every process exit and the photograph still showed none: the photographed page is the panic page panic_with_options renders for a critical exit, carrying only the panic record (the exit prefix string, frames, pages/free under the page's fixed header), and console output printed before the panic never lands on it, so no console placement can put the rows on that page. Fix: boot_progress_critical_exit in package/FuxiBootProgress.c now appends the persist counters to the exit prefix string itself (bounded snprintf into the caller's 1024-byte buffer, sheng's row values on one line), so they render as part of the panic record; boot_progress_exit keeps its per-exit console rows. chain53's boot otherwise matched chain51/52 (watchdogd[151], namespace 2 subcode 0x5, pages=0x1229cd): three persist=1 boots have not disturbed the boot. Phase B acceptance is unchanged - the window recognized (state 6 resumed read-only after the blank probe, or 7 kept), writes and syncs 0, GPT unchanged across the attach - and stays open pending the chain54 photograph.", "Build #71 (2026-11-06, head 19ecc016) failed at Build kernel: FuxiBootProgress.c:168:1: error: extraneous closing brace - the ungating edit that dropped the once-only gate left the gate's own closing brace in the file (the pre-push diff review cut off above the final braces, and the record sim does not compile C). The stray brace is removed, with no other change to the 19ecc016 behaviour. A local stub-header syntax check (clang -fsyntax-only against a stub kern/misc_protos.h) reproduces the CI error on the broken file and passes both the B1 original and this fix, and joins the pre-push routine for kernel C edits.", "Persistent Data phase B closed and phase C opened (2026-11-06): chain54 (Build #73, head e751531c) photographed the panic string itself carrying the counters - watchdogd[148] exited, fuxi persist st=1 hdr=1 gpt=0/0 lba=57bd52 pres=0 ld=1 wr=0 sy=0 er=0 - so the read-only proof passed on the device (see storage for the reading of the values). Phase C (owner-approved at its gate, 2026-11-06): board.toml kernel_args set sheng-data-persist=2 and add sheng-data-reset=1 for the install boot. The reset is load-bearing, not decorative: on a blank window, persist::Overlay::open with mode 2 and no reset returns Kept (state 7, overlay inactive, no store writes ever), and only the reset path initialises the window (zeroed bitmap first, header last) and returns Fresh (state 3, direct mode). reset=1 rather than 2: BootWatchdogPolicy.c reads 2 as erase-Data-and-show-Hello and 1 as erase-Data-with-Setup-staying-skipped. Acceptance is two boots: the install boot photographs st=3 with wr>0, sy>0 and pres>0 in the panic string; a follow-up commit then drops sheng-data-reset=1 and the resume boot must photograph st=2 with hdr=0 and pres>0 - the first boot's written state recognised across the reboot.", "Persistent Data phase C install boot device result and resume wiring (2026-11-06): chain55 (Build #74, head f35f8863) photographed st=3 hdr=1 gpt=0/0 lba=57bd52 pres=33223 ld=1 wr=33243 sy=280 er=0 over the usual watchdogd exit report - the reset initialised the blank window (Fresh, direct mode), 33,243 pages were written through in 280 durable commits and 33,223 of them were still present at the exit (the 20-page difference is rewrites of already-present pages); hdr=1 is the pre-existing blank block's checkHeader result, the header the install boot wrote is what the next boot reads. board.toml now drops sheng-data-reset=1 again, keeping sheng-data-persist=2: the resume boot must recognise the install boot's header (hdr=0) and resume read-write (st=2) with pres>0, which is the cross-reboot half of the phase C acceptance. Leaving the reset in would start the overlay over on every boot and discard the accumulated state.", "Persistent Data phase C closed on the device (2026-11-06): the first resume attempt (chain56, Build #75) photographed st=7 hdr=3 pres=0 - checkHeader returned 3, a valid header keyed to another seed, because each CI run grows a fresh, non-byte-identical Data seed (chain55's grown seed df83bf77..., chain56's 90a9d7fd...) and the store header keys on the seed identity (SeedDisk.h seedIdentity hashes the seed size and its nonzero pages); the window was left untouched (wr=0, sy=0). chain57, assembled locally from Build #75's kernel and chain55's own grown seed, photographed st=2 hdr=0 pres=81386 ld=19214 wr=9226 sy=1310 er=0: the install boot's overlay was recognised, read back (ld is 1 in every non-resumed boot) and extended. State written by one boot now survives a reboot; the persistent Data stage (phases A, B, C) is complete. Standing rule from this: the two boots of a resume pair must carry the same seed bytes - a CI-regrown seed breaks continuity exactly like a foreign one.", "Build workflow skips documentation-only pushes (2026-11-06): build.yml's push trigger gains paths-ignore for '**.md' and 'porting.toml', so a push whose changed files are all Markdown or the porting record no longer runs the four-job build (host tests, kernel-target compile, data seed, boot image) - Build #77 spent a full cycle on the README-only head bd5b2719. The Device documentation workflow is unchanged and still validates every records push; pull requests and manual dispatch still build. This finding rides in the records commit after the workflow commit, whose own Device documentation run fails for the recorded reason - the configuration finding a workflow change requires cannot sit in the web-editor commit.", "Skip-setup kernel writer (2026-11-07, UI stage, owner chose the kernel route (b) over seed editing): package/BootWatchdogPolicy.c gains sheng_boot_skip_setup, gated by the new board.toml kernel argument sheng-skip-setup=1, which writes the official 21H461 skip-setup preference profile (the value set of OddlyLabs/UniXNU scripts/seed-data-skip-setup.py, including its --no-auto-dim springboard keys) as five XML plists into /private/var/mobile/Library/Preferences on the mounted Data volume - owner mobile (501), mode 0600, fsync then fstat-verified, through the same scratch-page write discipline as the file's disabled.plist write - plus the seed tool's /private/var/containers directory set, created level by level. The host-side seed route is closed to this line: the tool and the payload driver's skip_setup_seed both require macOS hdiutil, and an edited seed would change the seed identity the persistent store's header keys on, orphaning the accumulated state for that boot (checkHeader 3, Kept); the kernel writer leaves the seed and the store untouched. Two constraints are load-bearing: the caller deliberately ignores the writer's return value, because sheng_boot_watchdog_policy's own return value panics load_init_program and a preference write must never be able to stop a boot (the worst failure is the Setup pages appearing); and the writer replaces whole files where the seed tool merges, so it first scans the existing purplebuddy plist for the SetupDone byte string - present in both the XML and the binary plist encodings - and leaves every file alone once Setup reads as done. board.toml also adds sheng-lite=1 for the first UI boots, engaging the policy's existing isolation list so locationd, CommCenter and identityservicesd stay out of the first SpringBoard start. Acceptance is a boot photograph with the persist counters still at st=2 hdr=0 and the screen past the Setup pages; the undo is the file's existing sheng-setup=1, which deletes the purplebuddy plists and shows Hello again.", "Build #80 (2026-11-07, head 06df70d6) failed at Build kernel, in build-boot-progress.py's compile of package/BootWatchdogPolicy.c under the kernel flags -Wall -Wextra -Werror -Wsign-compare: the skip-setup writer's policy_write_file verified each write with st.st_uid != uid and st.st_gid != gid, comparing the kernel stat64's uid_t/gid_t (unsigned int) fields against the helper's int parameters - two sign-compare errors at line 216, read from the downloaded log archive's 9_Build kernel.txt. The same step's bootstrap-pass link failure (01:43 UTC, nine undefined archive symbols) is the scripted compile-record harvest that runs before the archives exist, present in green builds too, and not a failure of this change. Fix: policy_write_file takes uid_t/gid_t. The pre-push stub check now uses the CI warning flags and an unsigned stat64 in its stub headers, and reproduces both errors on the broken file while passing the original file and the fix.", "chain59 observability (2026-11-07): chain58 (the Build #81 kernel with the skip-setup writer) booted twice on device. Boot 1 resumed the store (st=2 hdr=0) and pres grew 81386 to 88090, but the photograph could not prove the writer ran - its printf lines live in the console stream and never reach the panic page, the same gap Phase B hit. Boot 2 was the owner-watched probe: no graphical frame at any point in the boot (no clock, no Hello), pres 92446 - so the display handoff never happens, or the UI processes never start, and the photograph cannot tell which. BootWatchdogPolicy.c now exports the writer outcome as two globals (sheng_skip_setup_result and sheng_skip_setup_probe; -1 and -2 until the writer runs), and FuxiBootProgress.c weak-imports them and appends sksu=result/probe to the panic string beside the persist counters, plus a UI census ui=sb:exec/exit,bb:exec/exit for SpringBoard and backboardd, counted in the boot_progress_process_stage hook (an exec counts at the 'exec process signature enter' stage, the note point UniXNU-sheng's census uses) and the boot_progress_exit hook - no process-list walk, no locking, and the name compares are hand-rolled so the observer file needs no new declarations. Reading a chain59 photograph: sksu=0/0 the writer wrote on a not-done volume; sksu=0/1 Setup was already done (the expected reading from chain59 on if chain58's writer landed); the ui counts separate 'SpringBoard never execs' from 'execs but never presents'.", "QcomXnuUsbDebug (ljhhkx529/QcomXnuUsbDebug 3fec41c) is vendored at upstream revision 3fec41c with exactly one recorded consumer adaptation (the QUD_CONTROL_REBOOT guard in kernel/QcomXnuUsbDebug.c, defaulting to upstream behaviour; see diagnostics for the log-only integration it serves) and wired entirely from this repository (2026-11-07): the canonical copy is package/drivers/QcomXnuUsbDebug, inside the board kit, because the tree assembler links a driver into the build tree only when the component catalog selects it and the catalog carries no QcomXnuUsbDebug entry; the first placement at drivers/QcomXnuUsbDebug never entered the build tree and Build #83 failed in the archive step with the module missing at kits/fuxi/drivers/QcomXnuUsbDebug (the copies left at drivers/QcomXnuUsbDebug are stale and pending deletion): patches/xnu/qcom-usb-debug-console.patch and qcom-usb-debug-worker.patch are the consumer-side darwin24 profile of its darwin22 XNU patch set, retargeted to xnu-10063.141.1 - printf.c re-expresses the disableConsoleOutput guard that 10063 moved into console_write (with the extern declaration no 10063 header provides) and serial_console.c captures ahead of that early return; the set applies cleanly on the pristine pin and on the full 65-patch stack in series order. scripts/build-fuxi-usb-debug.py runs the module build script scripts/build.py on an adapted copy of the pe_kprintf compile record (the wrapper appends -DQUD_CONTROL_REBOOT=0, compiling out the not-yet-provided reset layer; see diagnostics) and publishes build/qcom-usb-debug/libQcomXnuUsbDebug.a; configs/fuxi_defconfig force-loads it through CONFIG_XNU_EXTRA_LD_ARCHIVES; board.toml adds the builder to the kernel archives and qcom-usb-debug=1 and qcom-usb-ctl=1 to kernel_args; the Build kernel step of .github/workflows/build.yml sets XNU_EXTRA_CFLAGS with the baseline default warning suppressions repeated verbatim (setting the variable replaces them) plus -DXNU_QCOM_USB_DEBUG=1 and the module include path, so the six patched units compile with the hooks live - without the define the patches are inert and the archive links unreferenced. Upstream ships QUD_PSCI_SMC_RESET=1 in soc/Sm8550.h and that value is kept: it is the profile for this same SoC, not a new profile; the control reset hook installs by compare-exchange against PE_halt_restart and fires only on an explicit control request.", "package/FuxiBootProgress.c additionally carries a stage-2 lifecycle probe (chain60, 2026-11-07): the boot-progress stage and exit hooks now also record SpringBoard and backboardd events into a fixed 64-slot ring (first-N kept, drops counted), one 'fuxi ev' line per record on the console stream, and a compact sbx digest of the raw SpringBoard exit arguments in the panic string. Stage events are recorded under their hook names (lm-enter, lm-returned, sig-enter, sig-accepted, sig-refused, mac-refused): the baseline zzz-boot-progress.patch calls the signature-enter hook before proc_process_signature and the load_machfile-returned hook before the caller checks the load result, so the census and probe exec counts are signature-entry counts, not successful execs, and no hook observes the final exec commit. The exit record keeps the raw wait-status word, the status&0x7f signal field and the raw namespace/code arguments; ppid and termination-reason presence are not observable from the hook arguments and are printed as unavailable rather than inferred. Records are published by a release store to a per-slot ready flag after all fields are written and are read back with acquire loads; the hooks themselves never print. Printing happens only in bp_ev_flush at the end of boot_progress_exit under a BUSY|AGAIN gate whose notification and handoff operations are acquire-release: exactly one flush prints, in sequence order, and a record claimed during a scan is rescanned by that scan's owner or by the contender that takes the released gate. The panic digest reads one claim snapshot and one flush-cursor snapshot, freezes the ready set in a 64-bit mask, appends every field whole or not at all, reserves the truncation marker and the evpending/evdrop/evunflushed suffixes before writing any tuple, and writes nothing when even that minimum does not fit. Host verification (2026-11-07): stub compiles under the kernel warning flags and under -std=c11 -Wall -Wextra -Werror, twelve host harness scenarios (main sequence, ring overflow at 65 and 70 claims, small-buffer truncation, pending and unflushed tails, whole-digest omission in a 140-byte panic buffer, a semaphore-forced flush handoff race, and a 4-thread x 300 stress run printing exactly sequences 1..64 once each in order), and an arm64-apple-darwin -O2 object build with no __atomic library calls (the gate lowers to casa/casal). Device-verified on chain60 (2026-11-07): 44 lifecycle records reached the USB stream with sequence numbers 1..44 consecutive, covering fourteen SpringBoard exits, all status 0x5, reason namespace 2, code 0x5; the probe is observe-only and changes no exit, restart or reset behaviour.", "Stage-2 fault probe (chain61, Phase 1 of the fault/KCDATA design): package/FuxiBootProgress.c's boot_progress_user_breakpoint and boot_progress_user_abort, weak no-ops through chain60 that discarded the EL0 fault state the zzz-boot-progress patch's trap-path call sites hand them, now capture it for SpringBoard and backboardd only, identified by proc_selfname in the trapping context: kind (breakpoint or abort), pid, mach ticks, pc, lr, sp, fp, esr, far, the task shared-region slide and x0-x28, in a fixed append-only array of 32 records published by a release store to a per-slot ready flag and read back with acquire loads; capture does no allocation, blocking or user-memory access, and other processes' faults only bump counters. Printing rides the lifecycle probe's single flush owner: bp_ev_flush's pass advances a cursor over the lifecycle records and, for each SpringBoard or backboardd exit, prints that pid's unconsumed fault records in claim order with the exit's signal and ticks and marks them consumed, followed by a fuxi faultstat line carrying the per-kind attempt totals and the kept, dropped, unavailable, consumed and pending counts, so an absent fault line is only read as not captured when those counters allow it. The panic string is unchanged. Host verification (2026-11-07): stub compiles under the kernel warning flags and under the builder's -mgeneral-regs-only flags for arm64-apple-darwin, eleven host harness checks under ASan/UBSan (target abort and breakpoint capture with all fields printed, non-target counting, claim order, consume-once across a pid reuse, unavailable non-64-bit saved state, append-only overflow at 32 kept with drops counted), and an arm64-apple-darwin -O2 object build whose only new undefined symbols are _current_task, _proc_selfpid and _proc_selfname. Device-verified on chain61 (2026-11-07): all sixteen SpringBoard exits in the capture window carry a same-pid breakpoint record at pc = lr = 0x1a721f2ec with esr 0xf2000000 (BRK #0) printed 733-7272 ticks before its exit, the final faultstat reads dropped 0, unavailable 0, pending 0 with zero abort-hook attempts in the whole window, and the panic string and census behaviour are unchanged; observe-only, and the Phase 2 signal-reason KCDATA readout is a separate design that is not yet approved.", "USB stage-2 activation (2026-11-07): commit ee617184be90d24b087ff02d5fd801294f1fcb20 uploads .github/workflows/build.yml with exactly one change (+5/-0), an XNU_EXTRA_CFLAGS environment block on the Build kernel step carrying the seven baseline -Wno suppressions repeated verbatim plus -DXNU_QCOM_USB_DEBUG=1 and the module include path into package/drivers/QcomXnuUsbDebug/include, which makes the qcom-usb-debug patch units compile with the hooks live (the wiring that finding 47 describes prospectively). Build #86 (run 42351918791) succeeded on that head; Device documentation #87 failed in about nine seconds because the commit changed the configuration area without a configuration finding, which this finding now supplies. The activation is device-verified by usb1, assembled locally from the Build #86 kernel with the chain55 seed: the kernel carries the qcom_usb_debug strings and zero qcom_reset_request references, so the QUD_CONTROL_REBOOT=0 compile-out is present in the linked kernel; the device enumerated on the host as the Qualcomm XNU Debug CDC gadget and streamed the full boot log (57,217 bytes) over the channel, and chain60 and chain61 have since captured their boot streams the same way. The workflow flags change no reset behaviour: the control channel reboot verbs remain compiled out and answer ERR unsupported until a reset layer is provided as its own stage.", "Legacy GOP display wiring (2026-11-08): board.toml selects the GopFramebuffer component (catalogue pin 19ef3a75ad2c53da85b8d923553d922716fce377), adds scripts/build-fuxi-legacy-display.py to the kernel archives and the four round-1 registration arguments (offline-mobile-graphics-load=1 offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-phase=4) to kernel_args; configs/fuxi_defconfig sets CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y and CONFIG_XNU_NATIVE_MOBILE_DISPLAY=n, so the baseline compiles the patched legacy probe call sites in and links build/native-legacy-display/libNativeLegacyDisplay.late.a. The presentation arguments (offline-legacy-pm/validate/transfer/cpu-present, sheng-vsync) are deliberately absent until the E3 framebuffer-handoff evidence gate passes. The kernel_args change does not alter the Data seed bytes, so the chain55 seed pairing for the persistent Data store is preserved.", "Build #97 (head 9e31f6ca) failed only at the image job's second, formal kernel link, and no ld diagnostic left the runner: the unixnu tool sends the full make output to the out tree's logs/kernel.log, the step log holds only its tail (the Mach-O segment layout and the clang++ exit line at 00:46:47Z), and the Collect step's find capped copies at -size -20M, which kernel.log exceeds (the step's own ls of that logs directory lists the other 19 logs, kernel.log absent). build.yml therefore tees the Build kernel step output to $RUNNER_TEMP/fuxi-build-97-final-link.log and the Collect step copies kernel.log explicitly without the size cap, so the final link's first real error is preserved in the fuxi-build-logs artifact on failure; no build input, gate or check changed."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The GitHub App cannot write workflow files (.github/workflows/*); workflow changes go through the GitHub web editor as separate commits, and a commit that changes build.yml must carry its configuration finding in the same commit, because the record checker validates only that commit's own diff."]
next_action = ["Persistent Data phase A: wire the vendored seed grower into the data-seed job and host-verify the grown seed (213 GiB container); then phase B adds sheng-data-persist=1 to kernel_args for a read-only proof boot, and phase C opens writes with sheng-data-persist=2 under its own owner approval. The stage order (persistent Data, then functional UI/display, then firmware enrollment) and its reasoning are recorded in Issue #1 (comment 6679165278)."]
