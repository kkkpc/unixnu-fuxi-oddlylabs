limits = ["The UFS root path is device-verified through the root mount, owner root authentication, launchd exec, dyld and the SystemOS cache mount: the chain46 boot (Build #46 kernel) reached the terminal state upstream's check-original-launchd-main-checkpoints.py asserts as the qualified endpoint of the original-launchd run (launchd at LC_MAIN; the run ends at the panic report for its mount[3] child exiting with status 66). The Data volume is a per-boot ephemeral RAM seed (OWNER_DATA_MOUNT with the pinned-UUID seed, no persistent store), not real storage: nothing written to /private/var survives a reboot, and a persistent Data window in userdata is a separate, flash-level step. The userdata flash is one-way: Android's /data was destroyed with it, and a rollback needs a full official fastboot ROM reflash."]
