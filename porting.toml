[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["include/FuxiPanel*", "package/*Display*", "package/*Framebuffer*", "package/*Backlight*", "package/*Panel*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*", "scripts/*legacy-abi.json", "scripts/test-legacy-*.py", "facts/panel_*"]
inputs = ["Panel xiaomi m3 38 0c 0a (Samsung DDIC by its command set), 1080x2400, DSI0 command mode with DSC 8 bpp, slices 540x40, 1.1 GHz.", "Splash framebuffer 0xb8000000 (0x2b00000), 32 bpp, stride 1080 pixels, the same region as sheng."]
configuration = ["package/FuxiPanelBoard.h holds the panel and controller constants with their sources.", "GopFramebuffer@19ef3a75 is selected in board.toml; package/FuxiLegacyDisplayProbe.cpp is the board glue (the two patch entry points and the component's 18 callbacks as observation counters) and scripts/build-fuxi-legacy-display.py builds the legacy archive from fuxi's E2 ABI record; CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y with CONFIG_XNU_NATIVE_MOBILE_DISPLAY=n."]
procedure = ["First stage: keep the firmware framebuffer (GopFramebuffer route), as sheng does."]
findings = ["73 DSI command sequences of the panel are decoded in facts/panel_cmds_*.txt.", "The PPS in the on-command gives pic_height 2520 while the timing and page address give 2400; unresolved.", "First implementation step landed host-side (2026-11-08; no device run yet): scripts/build-fuxi-legacy-display.py builds build/native-legacy-display/libNativeLegacyDisplay.late.a from exactly three members (the late-ified component object, the generated original bindings, the board glue object), binding exclusively from fuxi's E2 ABI record (scripts/fuxi-21H461-mobile-graphics-legacy-abi.json, sha256 f5d3f629a7cc507c493c9ccb05de2cf610110afa8a133c0cb06e213a7ecec229), whose provenance limits are inherited, not upgraded: its runtime-metadata leg was substituted under the audit's fallback rule, the instance size is a carried value, and original_client_initializer is unqualified and excluded from the bindings. The builder hard-fails unless the record hash matches, a verification original located in the actual build tree (a staged prelink candidate, else the decompressed original kernelcache verified against the OS profile pin) hashes its IOMobileGraphicsFamily __TEXT_EXEC to the record's family_text_sha256, and the compiled component vtable matches the record. backend_guard panics per its noreturn contract, gpu_offer returns false (no GPU presenter), and prepare_scanout permits scanout: the boot-progress layer exports no scanout prepare/cancel pair, so the kernel console and any presented frame share the GOP framebuffer, an evidence-quality caveat for presentation judging rather than a registration blocker. The catalogue board dependency 'display power hooks' is DEFERRED, not implemented: the component registers a logical PM plane itself and declares the main display powered by firmware, and this step adds no fuxi panel-power or backlight code. Round 1 carries only the four registration arguments; presentation arguments wait for the E3 handoff evidence gate.", "Build #91 (2026-11-08) failed at the display archive step: the builder's verification-original gate found neither a staged prelink candidate (this pipeline has no producer for one) nor the decompressed kernelcache, which the framework only creates at prelink time, after the archive steps. The builder now locates the kernelcache in the framework's own layout (<out_root>/ipsw/<build>/kernelcache.decompressed, unique glob match, sha256 checked against the OS profile pin) and, when it is absent, materializes it through the framework's own CLI (unixnu ipsw fetch KernelCache, the device taken from the framework's state file), which prelink later reuses; the build report records when this happened. The family __TEXT_EXEC hash gate itself is unchanged.", "Build #92 (2026-11-08) failed at the same gate with the CLI-materialization message: the framework CLI in fact succeeded (it exits non-zero noisily when it cannot fetch or decode), but the builder's re-search looked in the wrong directory - OUT_ROOT was computed as ROOT.parents[4], one level too high (the tree is <out_root>/<device>/<os>/<work>/tree, so out_root is parents[3] and the framework checkout is parents[4]). The builder now derives OUT_ROOT = ROOT.parents[3] and FRAMEWORK = ROOT.parents[4], and locates the kernelcache exactly via the UNIXNU_IPSW_BUILD variable the framework passes to archive steps (kernel.py xnu_env) at <out_root>/ipsw/<build>/kernelcache.decompressed, keeping the UNIXNU_KERNELCACHE override, the CLI materialization fallback and both hash gates unchanged.", "Build #93 (2026-11-08) proved the kernelcache path fix in the archive log (framework_root and out_root resolved correctly, ipsw_build 21H461, the materialized kernelcache matched the OS profile pin and the family text hash matched the E2 record, and the component object compiled and passed its audit), then stopped at the vtable gate: slot 21 of the compiled table names the original class init, whose address the E2 record carries in its top-level original_init field and in methods[21] but not in bindings. The builder now maps that one symbol explicitly from the record (apply_original_init_alias: slot identity, agreement of both record fields, and no conflicting binding are all required; no other inherited method is inferred, the E2 record and its pin are unchanged, and the 358-entry gate is not weakened), with a host regression test (scripts/test-legacy-init-alias.py, four cases) covering the pass and the three refusal modes.", "Build #94 (2026-11-08) passed the slot-21 alias and stopped at the next unbound original-class vtable entry, slot 44 (IOMobileFramebufferLegacy::setProperties), showing the bindings gap is table-wide rather than per-slot. A full 358-slot reconciliation followed against the compiled-table classification and the record: the bindings map covers only the symbols the audit named directly, while every remaining original-class entry's address is present in the record method table (164 slots match named kernel exports exactly, including the 9 abstract slots resolving to the pure-virtual trap; all other original addresses lie inside the family __TEXT_EXEC). The builder now derives the missing bindings from the method table in accounted forms only (derive_missing_bindings): exact opaque{i} prototype names at slots >= 168; compiler-verified named manglings at cross-checked slots (setProperties 44, getDisplayDimensions 249, completeCurrentSwap 295, applyStateRequest 354, and the systemWillShutdown/probe/getWorkLoop set at slots 79/85/111, read from the symbol the compiler placed at each slot); and qualified base calls matched to the component override twin at the same slot (free, setPowerState, start, stop, newUserClient, getRefreshAttributes). Standalone record fields (original_init, original_start, original_stop, original_new_user_client) must agree with the method table wherever a derivation touches their slot, a conflicting binding refuses, anything unaccounted stays unbound, and Gate 3 now prints the complete violation list before failing instead of stopping at the first entry; the build report records each derived binding with its provenance. Host regression: scripts/test-legacy-derivations.py (eight cases, including the full 185-binding derivation against the real record). This supersedes the 'no other inherited method is inferred' clause of the Build #93 finding; the E2 record and its pin are unchanged and no gate is weakened.", "Build #95 (2026-11-08, head 32b3f435) passed the display archive step - Gate 3 green with 179 bindings derived from the method table (7 named: slots 44, 79 systemWillShutdown, 85 probe, 111 getWorkLoop, 249, 295, 354; plus 172 opaque; the six qualified-base-call twins were not needed because the compiled component object does not import those originals) - and failed at the final kernel link: the component's _native_legacy_* callback imports were undefined, including _native_legacy_swap_stage, _native_legacy_swap_validation_observed, _native_legacy_transfer_observed and _native_legacy_vsync_observed referenced from NativeLegacyDisplay.late.o. The root cause is a linkage mismatch, not the ABI derivation: NativeLegacyDisplay.cpp declares all 18 board callbacks extern \"C\", but package/FuxiLegacyDisplayProbe.cpp defined them as plain C++ functions outside its extern \"C\" state-variable block, so the glue object exported mangled symbols (host nm check with the kernel toolchain: _Z24native_legacy_swap_stagej and its siblings, against the component's _native_legacy_swap_stage import). The bootstrap-pass undefined symbols (_qcom_usb_debug_*, _sheng_pmgr_run) are the expected pre-archive noise and are not this failure. Fix: the 18 callback definitions in package/FuxiLegacyDisplayProbe.cpp now sit inside an extern \"C\" block matching the component's declarations; the two probe entry points keep their existing linkage (the framework patch calls them in C++ form and they resolved at the same link), no stubs were added, and the E2 record, its pin and all builder gates are unchanged.", "Build #96 (run 42427029836, head e0a76060) failed at the same final kernel link with exactly three undefined symbols: _native_legacy_display_probe (from bsd_init and native_mobile_graphics_client_probe), _native_legacy_display_late_probe (from bsd_autoconf) and _native_adreno_fences (from NativeLegacyDisplay.late.o note()/gpuWrote()). This corrects the Build #95 finding above: the patch series does not call the probe entries in C++ form - patches/xnu/offline-component-load-probes.patch and offline-legacy-start.patch declare both as plain C (extern void native_legacy_display_probe(void);) in bsd/kern/bsd_init.c, so the glue's plain C++ definitions exported only mangled names (nm-verified on a minimal translation unit with the vendored clang-18). Fix: both probe definitions now sit inside an extern \"C\" block in package/FuxiLegacyDisplayProbe.cpp. _native_adreno_fences is the pinned component's weak_import GPU fence query (NativeLegacyDisplay.cpp:54); both call sites test its address before calling (:175, :319), round 1 selects no GPU provider, and the static kernel link reported the weak import as a hard undefined symbol. scripts/build-fuxi-legacy-display.py now binds exactly this one allowlisted optional import to absent (0) in the bindings object - no implementation is provided, the component takes its designed no-provider path - gated on the compiled object importing the symbol as a weak reference (n_desc N_WEAK_REF, which the builder now records per undefined import), on the weak_import declaration and on the guarded call sites in the pinned source. scripts/test-legacy-linkage.py covers the glue structure and the binding decision (12 cases, host PASS); the E2 record, its hash, the three-member archive and Gate 3 are unchanged, and no undefined symbol is masked: any non-allowlisted or non-weak import still fails the build or the link.", "Build #99 (run 42448754328, head b292a5cc) failed at the formal kernel link with a single error: ld fixup arm64_b26 at NativeLegacyDisplay::note()+0x44 in libNativeLegacyDisplay.late.a[2] (NativeLegacyDisplay.late.o), from 0xFFFFFFF00BF7B2E8 to 0x00000000 (_native_adreno_fences), displacement 68518694168 against the +/-128 MiB B/BL range; the RangeFile fix in the same head held (archive-01 passed, no stall). This corrects the Build #96 finding above: binding the weak_import fence query to absolute 0 is not a viable no-provider state, because both call sites (note() :175, gpuWrote() :319 in the pinned component) are direct calls whose branch target the linker must resolve before the component's address-availability checks can run; an absolute-0 binding is only valid for indirect or data references. The pinned component and the E2 record are unchanged. Fix: package/FuxiLegacyDisplayProbe.cpp now defines native_adreno_fences itself, extern \"C\", with the component's exact ABI (bool (uint32_t *, uint32_t *)), returning false - the no-provider answer: note() keeps its zero submitted/retired counts and gpuWrote() takes its no-fence path; no fence state is fabricated, and the query remains unimplemented as a GPU feature. scripts/build-fuxi-legacy-display.py no longer emits any binding for the symbol; Gate 3 instead verifies the board definition (weak-reference import, weak_import declaration, at least two address guards in the pinned source, and a glue definition with the exact signature inside an extern \"C\" region returning false) and, after compilation, that the glue object exports _native_adreno_fences as a defined section symbol while the bindings object does not mention it; build-report.json records board_provided_imports in place of the retired absent-binding fields. scripts/test-legacy-linkage.py covers the new contract (21 checks, host PASS, including a regression check that the builder carries no absent-binding mechanism). Host-side miniature only: the verbatim-extracted definition compiled to a defined TEXT symbol, and a weak_import caller carrying the same two ARM64_RELOC_BRANCH26 call sites linked against it at displacements of 196 and 72 bytes. The formal kernel link itself, the in-kernel displacement and any device behaviour remain CI/device evidence, not host claims."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["No device evidence for display."]
next_action = ["Boot the round-1 image (fastboot boot only, chain55 seed pairing preserved) and judge provider registration and main CADisplay enumeration by the three-read standard (USB stream, panic census, screen); enable the presentation arguments only after the E3 handoff evidence gate (pixel format, GOP-to-PE propagation, framebuffer reservation) passes."]
