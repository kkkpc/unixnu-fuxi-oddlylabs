schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi). Board files from the UniXNU device template, the FTM5 touch driver and its staged kernel probe; CI builds the kernel, the payload, the DEBUG firmware and the fastboot boot image. On 2026-11-02 the image boots on the device to bsd_init (e901139), and the touch probe's stage 3 reads the controller's chip id 36 40 there. With the PMGR bridge (484a650) the kernel runs on to the root device wait, and stage 4 reports real touches, with polling and with the interrupt."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "LICENSE", "scripts/*boot-progress*", "package/*BootProgress*"]
inputs = ["UniXNU examples/device template (SM8550, iPadOS 17.7.11 profile).", "UniXNU-sm8550-common at 23b2049fcd9e30356161def84231334fb55ecca9."]
configuration = ["board.toml: name fuxi, kit fuxi, soc_source sm8550, os_profile ipados-17.7.11-21H461, device_tree.source device:dts/fuxi.dts.", "configs/fuxi_defconfig: the template options, CONFIG_XNU_NATIVE_ADRENO off (the SoC fragment turns it on), and CONFIG_XNU_EXTRA_LD_ARCHIVES for the touch archive and the force-loaded HID archive. The arch fragment sets CONFIG_XNU_BUILD_ARCHIVES, CONFIG_XNU_NATIVE_AES, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN; the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS.", "[kernel] archives in build order: corecrypto (plain and namespaced), ArmDTPlatform, ArmCpu, SoftwareAES and its bindings, libpthread, the mockfs fixture, build-fuxi-platform-power.py, build-fuxi-hid-input.py, build-fuxi-ram-block.py, build-fuxi-touch.py."]
procedure = ["./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi", "./unixnu status --json", "./unixnu build kernel"]
findings = ["CI (.github/workflows/build.yml) pins OddlyLabs/UniXNU and OddlyLabs/uefi-fuxi at full revisions; after merging upstream into either fork, update UNIXNU_REF or UEFI_REF and let the image job run again.", "The image job installs Homebrew's openssl@3 itself rather than relying on the runner image: the encryption step uses OpenSSL 3 (PBKDF2 for the image, RSA-OAEP with SHA-256 for its key).", "configs/fuxi_defconfig sets CONFIG_XNU_DT_PANIC_REGION. The template and the arch, SoC and OS fragments leave it off, and then the BCM2837 target uses its fixed panic log address (see memory); every other SM8550 defconfig in reach (UniXNU-sheng, Kerfand, MinecraftVM) sets it. On the device the kernel with it passes PE_create_console and reaches bsd_init (evidence/2026-11-02-first-boot.md). The kernel check of the image job fails if PE_create_console mentions 0x3c0f.", "CI pins uefi-fuxi c5793bc2 since the memory map fix for this 12 GB unit (see firmware and memory).", "configs/fuxi_defconfig sets CONFIG_XNU_SHENG_PMGR and board.toml adds build-fuxi-platform-power.py to the archives and sheng-pmgr=2 to the boot arguments, as UniXNU-sheng and the community fuxi ports do: AMFI needs an ApplePMGRNub (see power).", "The image job also uploads the unpatched prelinked kernel (gzip) and payload.json, the kernel encrypted with the image key, so payload variants such as entry-probe images are built without macOS.", "The host tests byte-compile scripts/*.py and ci/*.py and parse ci/decrypt-boot-image.sh with bash -n, so the image tools are checked on every push.", "The merged configuration is the arch, SoC and OS fragments followed by the defconfig; the archive list has to cover every archive the merged options require, not only those of the template defconfig.", "CONFIG_XNU_SOURCE_MOCKFS (OS fragment) makes vfs_conf.o reference mockfs, so the link needs build/mockfs-fixture/libmockfs_fixture.a: the first CI kernel build at 450f518 applied all 62 patches and built every listed archive, then stopped at that missing archive.", "ArmCpu needs the source corecrypto provider, so corecrypto is built before the components, as in UniXNU-sheng.", "board.toml's kernel_args start the secondary cores (sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1, the arguments of image s3-selfipi) and run the touch probe to stage 4 with the HID digitizer (fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2), so the CI image waits for a touch and otherwise ends in the root device wait.", "fuxi_defconfig sets CONFIG_XNU_NATIVE_RAM_BLOCK=y. Without CONFIG_XNU_SOURCE_STORAGE the kernel build script requires CONFIG_XNU_NATIVE_AES (set by the arch fragment) and force-loads build/ram-block/libRamBlock.a; the owner Data code of patches/xnu/offline-owner-systemos-mount.patch stays out, since CONFIG_XNU_OWNER_DATA_MOUNT is not set.", "board.toml's kernel_args add sheng-touch-hid=1, which NativeHidInput reads to give its default device the digitizer collection.", "board.toml selects the native UFS root (2026-11-04): a [userdata] section with the GPT-verified span (first LBA 3110976, last LBA 61850618, 4096-byte LBAs; see storage), the ShengUfs and VerifiedRoot components, the component:ShengUfs kernel archive and native-ufs-root=1 in kernel_args; configs/fuxi_defconfig sets CONFIG_XNU_NATIVE_UFS=y and the four verified-root options of UniXNU-sheng. ./unixnu status --json reports the merged configuration with both components.", "Build #10 (2026-11-04) failed at the owner-root trust guard in UniXNU scripts/build-xnu-4k-baseline.sh: CONFIG_XNU_OWNER_ROOT_TRUST=y requires CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y or CONFIG_XNU_SOURCE_STORAGE=y, and the first UFS wiring copied only the verified-root lines from UniXNU-sheng configs/sheng_defconfig without the virtio line. board.toml now includes the VirtioMmioBlock component and its archive, and fuxi_defconfig sets CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y, mirroring sheng iPadOS 17 (the build script force-loads the component archive at build/virtio-mmio-block/libVirtioMmioBlock.a by default).", "Build #11 (2026-11-04) passed that guard but failed to link: CONFIG_XNU_VERIFIED_ROOT_ARCHIVE pointed at sheng bundle path build/verified-root-os-xnu-bundle/libVerifiedRootProbe.a, which no fuxi build step produces. The probe archive is signed out of an owner-policy pipeline (UniXNU scripts/build-owner-os-policy.py and build-verified-root-probe.py) frozen to sheng board values (its root UUID 04769D26, its image digests, macOS hdiutil attach state), with no fuxi counterpart yet. Decision (owner, 2026-11-04): the first UFS boot drops the owner-root chain — fuxi_defconfig no longer sets CONFIG_XNU_VERIFIED_ROOT_PROBE, CONFIG_XNU_OWNER_ROOT_AUDIT, CONFIG_XNU_OWNER_ROOT_TRUST or the archive override — and relies on the driver manifest hash verification; the chain is ported as its own step after the root boots.", "Build #12 (2026-11-04) then failed on the bindings audit the VIRTIO_BLOCK symbol enables (build/virtio-mmio-block/bindings.json is produced only by the original-storage bindings generator, which this board does not run), and source inspection showed the simplified route cannot link at all: UniXNU build-arm-driver.py compiles NativeUfs.cpp unconditionally with -DNATIVE_VERIFIED_BLOCK=1, whose policy data symbols only the sheng owner-policy pipeline generates. Route taken (owner decision, 2026-11-04): the ShengUfs, VerifiedRoot and VirtioMmioBlock components are deselected, CONFIG_XNU_NATIVE_VIRTIO_BLOCK is removed, the driver sources are vendored unmodified in kits/fuxi/ufs/ (UniXNU/ShengUfs, BSD-2-Clause) and built device-side by scripts/build-fuxi-ufs.py without the verified define, output at the fixed build/sheng-ufs/libShengUfs.a path the kernel script force-loads under CONFIG_XNU_NATIVE_UFS=y.", "board.toml [payload.adt] sets root_match_volume_uuid = \\\"04769D26-2CA0-4825-B443-E2E5F88300F2\\\" (2026-11-05, corrected the same day): devicetree.py turns it into the ADT /chosen root-matching property (IOMedia by UUID) that IOFindBSDRoot matches, the root selection UniXNU-sheng uses for this OS profile. The value is the OS image's System volume UUID: it occurs 17 times in the decoded OS image, and it is identical to sheng's value because the image is byte-identical. The value first recorded here, 10F30600-0000-0000-0476-9D262CA04825, was a misread extraction (an 8-byte prefix glued onto the real UUID's first half) and every later byte check searched for the wrong string and found it; it occurs only as the 8 bytes before three of the real UUID's occurrences. Device proof of the correction: an image carrying the wrong value (Build #31 kernel) still ended in the root device wait ('Failed to mount root device', IOKitBSDInit.cpp), while the corrected image (ufs-boot-pubfix2) found the root by matching, mounted the APFS System volume and advanced to the sealed-root authentication check in bsd_init (see storage).", "Owner-root trust chain ported (owner decision 2026-11-05, reversing the 2026-11-04 first-boot simplification recorded above): the pubfix2 device boot proved the chain load-bearing - with publication and root matching fixed the kernel mounted the UFS root and panicked 'rootvp not authenticated after mounting' (bsd_init.c), and on a non-macOS target that FSIOC_KERNEL_ROOTAUTH check has no pass other than the owner authorization of patches/xnu-12377/offline-owner-root-binding-audit.patch. fuxi_defconfig again sets CONFIG_XNU_VERIFIED_ROOT_PROBE, CONFIG_XNU_OWNER_ROOT_AUDIT, CONFIG_XNU_OWNER_ROOT_TRUST and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE (the two-volume bundle path), plus CONFIG_XNU_NATIVE_VIRTIO_BLOCK for the build script's guard; board.toml selects the VirtioMmioBlock and VerifiedRoot components and adds component:VirtioMmioBlock and build-virtio-mmio-bindings.py to the archives (the step whose absence failed Build #12). The earlier reading that the policy pipeline is frozen to the sheng board was wrong: its constants (the OS volume UUID above, the IPSW member and image digests) are this iPadOS 17.7.11 image's own, so scripts/build-fuxi-owner-root.py runs the pipeline in the build with a per-build owner keypair and produces the bundle archive before the kernel link (see storage).", "Push encoding incident (2026-11-05): the trust-chain pushes f0c230ea and b79c9ee4 sent every file's content base64-encoded to a push tool that stores content raw, so all six files landed as base64 text and Builds #32/#33 and Device documentation #32/#33 failed in seconds (Host tests py_compile on the base64 first line of scripts/build-fuxi-ufs.py). The change set was re-pushed raw as 7aed4d87 and ec981af2 and every file was read back and byte-compared against the local tree. Device documentation #34/#35 still failed afterwards with a TOML parse error at line 1, column 83512: the checker parses the BASE revision's porting.toml to diff changed areas, and the base of those runs was still the base64-corrupted file - the error is in the comparison base, not in the current record (reproduced locally with the corrupted file as base). The check self-heals on the first push whose base carries a valid porting.toml; this finding is that push's record.", "Board archives correction (2026-11-05): the VirtioMmioBlock bindings entry now names the device script scripts/build-fuxi-virtio-bindings.py instead of UniXNU's build-virtio-mmio-bindings.py. The upstream script consumes build/storage-abi/interface-audit.json, a maintainer research record no build step produces, so the entry could never succeed in a fresh CI tree; the device script binds from the recorded ABI data in scripts/fuxi_storage_abi.py, the same source the RAM block bindings use (see storage). This configuration finding is the record the checker requires for the board.toml change itself - the Build #36 storage finding alone did not cover it, and Device documentation #37 failed on exactly that.", "Boot progress enabled (2026-11-05): CONFIG_XNU_BOOT_PROGRESS=y. The baseline builds libBootProgress.a itself when the option is on (it requires the native UFS + owner-root audit + source corecrypto configuration, which this board now has) and the zzz-boot-progress patch then declares boot_progress_poll as a real function; with the option off the same declaration collapses to a no-op macro for kernel sources, but the verified UFS driver - compiled outside that patch's reach - references the real symbol (Build #39's link). Sheng's defconfig enables the same option.", "Build #40 (2026-11-05, 852979ca) failed in Build kernel at build-xnu-4k-baseline.sh line 90: with the option on the baseline runs python3 scripts/build-boot-progress.py, but no tree in this line carries that script - not the board repo, not OddlyLabs/UniXNU at 6ae4c252, not upstream UniXNU - so enabling the option without its builder broke the build before the archives. The board now ships scripts/build-boot-progress.py, which compiles package/FuxiBootProgress.c against the bootstrap's startup.o compile record into build/boot-progress/libBootProgress.a, the archive the baseline force-loads. The source defines the thirteen boot_progress_* entry points of patches/xnu/zzz-boot-progress.patch's kern/boot_progress.h as weak no-ops (boot_progress_active returns 0, so console output keeps using the real console); the verified UFS driver needs only boot_progress_poll, the other twelve are the patch's call sites in arm_init, startup, the video and serial consoles, pe_kprintf, bsd_init, kern_exec, sleh and kern_exit. Sheng's full monitor (package/BootProgress.c with framebuffer rendering, a process census, a watchdog policy and a diag export) is not ported: this kernel has no working display path yet, and the observer's only load-bearing job here is satisfying the link. Sheng's own build-boot-progress.py is not reusable either - it compiles sheng-only kit sources (BootFaultProbe, BootWatchdogPolicy, BootDiagExport, AdspFirmware) that have no fuxi counterpart.", "System trust bundle wired into the payload (2026-11-05): board.toml [payload] pins trust_cache_sha256 to upstream's two-module original bundle (7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7), and the Build workflow gains a 'Build system trust bundle' step before 'Build payload' and passes --trust-cache to the payload step. Build #41's payload carried no trust cache at all (payload.json trust_cache_sha256 was null), so AMFI had no CDHash for the full-system /sbin/launchd and the kernel killed it at exec with OS_REASON_EXEC / EXEC_EXIT_REASON_SECURITY_POLICY (device photo 2026-11-05 ~15:44 CST). No kernel or defconfig change in this step.", "Build #43 (2026-11-05, 0493551c) failed before the payload ran: the 'Build payload' step was written as a YAML plain scalar (run: without |), so the line break folded to a space and the trailing backslash became a stray single-space argument, and the driver's argument parser rejected the command with exit code 2 ('unrecognized arguments: --trust-cache ...'). The 'Build system trust bundle' step had already succeeded on the same run (bundle 61,356 bytes, sha256 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7, matching the pin), so the failure was the workflow's line folding, not the bundle or the driver - the same driver at UniXNU 6ae4c252 accepts --trust-cache, verified locally with the exact argument shape. The step is now a block scalar (run: |), the shape every other multi-line step in this file already uses. The Device documentation run for the same head failed too: its checker diffs the push's base (4f4a0692) against HEAD, and that diff held only build.yml while this area's trust-bundle finding sat in the base commit, so it demanded a configuration finding update; this finding is that update, pushed after the workflow fix so the final head's docs diff holds porting.toml only.", "Owner cache mount enabled (2026-11-05): CONFIG_XNU_OWNER_CACHE_MOUNT=y, CONFIG_XNU_OWNER_CACHE_STARTUP=y and CONFIG_XNU_OWNER_UNION_SYSTEMOS=y. The chain45 device boot passed the trust-cache gate - launchd exec'd and dyld started - then initproc failed with OS_REASON_DYLD (namespace 6), 'no dyld cache': the SystemOS (cryptex) volume was published by the UFS driver but never mounted, because the offline-owner-systemos-mount patch's code is gated by these options and was not compiled in at all (zero native_owner_cache strings in the Build #45 kernel). With the trio on, the kernel mounts the SystemOS volume - found by UUID through the verified-block layer; the baseline's generated header defaults that UUID to this image's SystemOS volume 8846FE78-2910-4297-AF97-D59BB6F8FC16 - as the upper union layer over / before exec'ing initproc, so dyld finds the shared cache at its standard path. This mirrors sheng_defconfig; upstream's union checkpoints assert native_owner_cache_stage==6 with status==0. OWNER_BOOT_MANIFEST and OWNER_DATA_MOUNT stay off (Data-volume stage).", "Build #46 (2026-11-05, c6b4a853; Build run 42018757736, Device documentation run 42018757700) succeeded on the first configuration with the owner cache trio in fuxi_defconfig (OWNER_CACHE_MOUNT, OWNER_CACHE_STARTUP, OWNER_UNION_SYSTEMOS). Host result only: the device check is the chain46 boot, and the kernel-marker verification runs with its assembly.", "Scratch Data stage enabled (2026-11-05, owner plan A - the whole step): CONFIG_XNU_OWNER_BOOT_MANIFEST=y, CONFIG_XNU_OWNER_DATA_MOUNT=y and CONFIG_XNU_OWNER_DATA_VOLUME_UUID=\"18AB5557-DC2D-469B-8758-855E60F5B0DF\" in fuxi_defconfig. This supersedes two statements above: the RAM-block finding's 'the owner Data code stays out, since CONFIG_XNU_OWNER_DATA_MOUNT is not set' and the cache-mount finding's 'OWNER_BOOT_MANIFEST and OWNER_DATA_MOUNT stay off'. The trigger is the chain46 device result: that boot reached the terminal state UniXNU's scripts/check-original-launchd-main-checkpoints.py asserts as the qualified endpoint of the original-launchd run (launchd reaches LC_MAIN with genuine AMFI/Sandbox; the run ends at the POSIX_SPAWN_PANIC_ON_EXIT report 'mount[3] exited', signal 0, exit status 66, which the checker pins as the mount child's normal exit), so the dyld-cache gate is closed and the open stage is a writable Data volume. BOOT_MANIFEST is the data mount's own guard (offline-owner-systemos-mount.patch #errors without it) and itself requires OWNER_CACHE_STARTUP (already on); it also makes the cache prepare publish the boot manifest. With DATA_MOUNT on, load_init_program runs native_owner_data_prepare after the cache prepare and before exec'ing launchd, and any failure panics 'offline scratch Data mount failed'. The baseline emits the XNU_OWNER_DATA_VOLUME_UUID header only when DATA_MOUNT and NATIVE_RAM_BLOCK are both on (both are), taking the value from this defconfig string option. The UUID is the one upstream pins (scripts/build-cpu-desktop-kernel.py sets it for its desktop kernel; its RAM-data checkpoints require the published IOMedia UUID to equal it), and sheng_defconfig carries the same three settings with the same value; guowenye's raphael line enables the same BOOT_MANIFEST + DATA_MOUNT pair independently. The Build workflow gains a 'Build Data seed' step before 'Build payload', passes --data-ramdisk to the payload step and copies the seed into the encrypted artifact set (see storage for the seed, packaging for the payload wiring). No board.toml or VERIFIED_ROOT_ARCHIVE change: on this baseline the data mount needs no WithData archive (see storage)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The GitHub App cannot write workflow files (.github/workflows/*); workflow changes go through the GitHub web editor as separate commits, and a commit that changes build.yml must carry its configuration finding in the same commit, because the record checker validates only that commit's own diff."]
next_action = ["Device-verify the Data stage with a locally assembled boot-only image (chain47): acceptance is the scratch Data mount completing (native_owner_data stage 4) and the boot proceeding past the chain46 terminal state."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board selection and archive order" },
  { kind = "host", command = "./unixnu defconfig fuxi_defconfig; ./unixnu build kernel", revision = "8b4c03f69fc15878d7ee92c0f157215fa235d78d", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41261795785", result = "All sources resolved, 62 patches applied, nine archives built, kernel linked and prelinked" },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt"]
inputs = ["OddlyLabs/uefi-fuxi, branch fuxi: a fork of UniXNU/uefi-sheng (the official Mu-Silicium fork for UniXNU) with the nine fuxi bring-up commits of matejkoo217/uefi-fuxi cherry-picked (authors kept, cherry-pick -x); its fuxiPkg derives from Silicium's SM8550 nuwa (Xiaomi 13 Pro).", "fastboot boot of the image (temporary, nothing is written to the device)."]
configuration = ["board.toml [firmware]: config fuxi, dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc, fd Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, and the submodules, edk2 patch and package path list of UniXNU-sheng's [firmware].", "fuxi.dsc: FUXI_VENDOR_HW = 0 (Mu drivers only; the previous stage keeps the panel scanning out), framebuffer 1080x2400x32, DDR base 0x80000000, the UniXNU menu, UniXNUDxe, DarwinBoot, DiskIo, Partition and FAT; FuxiBootMemoryDxe publishes the payload volume the shim hands over."]
procedure = ["./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (CI: the image job of .github/workflows/build.yml)."]
findings = ["UniXNU provides the boot menu (UniXNUPkg) and the XNU loader (DarwinBoot) as UEFI modules; the board firmware that runs them on the phone is a Mu-Silicium platform, and upstream Mu-Silicium has no fuxi platform.", "Measured on hardware in matejkoo217/uefi-fuxi: with text offset 0 in the shim's ARM64 header the ABL loads the image and the firmware's DEBUG console prints on the panel; with the firmware address there the ABL answers Load Error.", "The firmware's FdtBlob (sm8550-xiaomi-fuxi.dtb, model 8550 fuxi, msm-id 0x207, board-id 0x10008) carries the root properties the ABL selects an appended DTB by; the DTB merged from OS3.0.309 keeps the base DTB's board-id 0 and is not used for the boot image.", "fuxiPkg Include/RAW.inc listed the vendor raw files SecParti.cfg, uefipil.cfg and QcomChargerCfg.cfg outside the FUXI_VENDOR_HW gate, so the first firmware build in CI (run 41268231266 at 72300f2) stopped at the missing Binaries/nuwa/RawFiles/SecParti.cfg; uefi-fuxi 87554bf9 gates them with their drivers.", "With FUXI_VENDOR_HW = 0 the volume holds UniXNU, UniXNUDxe, DarwinBoot, FuxiBootMemoryDxe, SimpleFbDxe, FAT, PartitionDxe and DiskIoDxe. FuxiGopLogDxe and FuxiDisplayDepexDxe are compiled but enter the volume only with USE_CUSTOM_DISPLAY_DRIVER = 1.", "On the device (2026-11-02, image 931ac958 of run 41273003819): the ABL accepts the v0 image (fastboot boot answers OKAY), the DEBUG firmware log appears on the panel, the UniXNU entry starts DarwinBoot, and DarwinBoot exits boot services and paints its green band. The log ends with SecurityLock LockCapsuleInterface, the normal exit-boot-services message; the DARWINBOOT lines above it are covered by the bands.", "DarwinBoot's hand-off page (photographed on 2026-11-02): kernel va 0xFFFFFFF00427C000 at pa 0x8C007C000 (the start of the 0x8C0000000 run, 2 MiB aligned, plus the kernel's offset in its 2 MiB block), window 0x130000000, video 0xB8000000 1080x2400 with 4320-byte rows at 32 bpp, EL1, PARange 2 (40-bit).", "uefi-fuxi c5793bc2 narrows the high DRAM rows of fuxiPkg to RAM on both the 8 GB unit the map came from and this 12 GB unit: 0x880000000 + 0x39D00000 and 0x8C0000000 + 0x140000000. Nothing from 0x8B9D00000 to 0x8C0000000 is listed, not even the 28 MiB that is RAM on both, because it borders holes that move with the DDR size. The rows stay static: clipping them against the ABL's /memory node would take an FDT parser in the shared SiliciumPkg SEC path. The change reaches 46 of the 54 FVMAIN modules, because SerialPortLib (FrameBufferSerialPortLib) finds its region through MemoryMapHelperLib and so links the table: exactly those 46 differ, and all 5859 changed .text instructions differ in immediates only. Booted on the device (run 41401828450, image m1-touch): no change in behavior.", "The firmware of run 41378843724 (the same code as 627fe52a) hands over a kernel that reaches bsd_init and draws its panic screen on the framebuffer DarwinBoot passes (e901139)."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The high DRAM rows cover the two measured units (8 GB and 12 GB); another unit has to be compared with its /proc/iomem. Reservations after the hand-off are not checked."]
next_action = ["Check the reservations after the hand-off (see memory)."]
evidence = [
  { kind = "source", reference = "https://github.com/OddlyLabs/uefi-fuxi/tree/fuxi", result = "Firmware fork with the fuxi platform" },
  { kind = "device", command = "fastboot boot boot.img", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "ABL Sending OKAY, Booting OKAY (product fuxi, unlocked, slot a); panel: DEBUG firmware log, then the DarwinBoot green band" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (Ubuntu 26.04, clang 21.1.8, uefi-fuxi 87554bf90a6f5707ceeb3720b3dc507de914db94, UniXNU 6ae4c252937ae1920ab68eaded10fc78447e0194)", revision = "72300f2b07ccee230e07caa7b31f5af269b4f942", reference = "https://github.com/OddlyLabs/uefi-fuxi/commit/87554bf90a6f5707ceeb3720b3dc507de914db94", result = "DEBUG SILICIUM_UEFI.fd built at 0x300000 bytes with the UniXNU menu, UniXNUDxe, DarwinBoot and FuxiBootMemoryDxe in the volume" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "DEBUG firmware from uefi-fuxi 87554bf9 built on macOS 26 at 0x300000 bytes (fd_sha256 627fe52af360...) and packed into the boot image" },
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "Firmware log, UniXNU entry, DarwinBoot hand-off (kernel pa 0x8C007C000, window 0x130000000, video 0xB8000000 1080x2400); the kernel reaches bsd_init and its panic screen draws on that framebuffer" },
  { kind = "device", command = "fastboot boot of image m1-touch (SHA-256 be38300f17d03ca1): uefi-fuxi c5793bc2, fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "Firmware with the corrected map: DarwinBoot hands over, the kernel reaches its touch report; no reset" },
]

[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["CPU layout and GIC ranges of SM8550 v2 (soc_id 519) from the stock device tree."]
configuration = ["The template ArmCpu and ArmDTPlatform selection."]
procedure = ["Boot to the XNU entry checkpoint and record the enabled CPUs.", "Boot with sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 and fuxi-touch=4 fuxi-touch-panic=2, then read the two SMP rows of the touch report (package/FuxiTouchProbe.cpp smpText): per secondary core the ArmCpu step (7 = running), failure code and CPU_ON result, the scheduler's processor count, and the timer interrupts and IPIs each core took."]
findings = ["On the device the boot CPU runs the XNU entry with the MMU off (blue band) and reaches the instruction before the MMU enable (magenta band). The image has no reset probe, so nothing marks later progress; no XNU console text and no panic screen appear, and the phone stays off USB. The stop therefore lies between the MMU enable and PE_init_printf in arm_init, the first point that can draw (xnu d8b80295 arm_init order: Apple register setup, DT init, ml_parse_cpu_topology, thread and CPU bootstrap, arm_vm_init, serial_init, PE_create_console, PE_init_printf).", "Entry-probe resets located the stop (2026-11-02): the kernel reaches the MMU enable, arm_init, cpu_data_init, PE_init_platform and configure_misc_apple_regs, and never returns from ml_parse_cpu_topology. The ADT gives cpu0-2 cluster-type E and cpu3-7 P (dts/fuxi.dts, copied from sheng), so the parser builds two clusters, while BCM2837 keeps MAX_CPU_CLUSTERS 1 (sm8550-common raises only MAX_CPUS to 8); the DEVELOPMENT kernel asserts cluster_id < MAX_CPU_CLUSTERS and panics before any console exists. UniXNU-sheng carries the fix as its board patch zzyf-sheng-amp.patch (__ARM_AMP__, MAX_CPU_CLUSTERS 2, Edge scheduler defaults without a performance controller); fuxi now carries it unchanged.", "With the AMP patch (65c4f4e) the reset probes after ml_parse_cpu_topology, thread_bootstrap, cpu_bootstrap, rtclock_early_init, kernel_startup_bootstrap, timer_call_init, cpu_init, processor_bootstrap, arm_vm_init, serial_init, kernel_startup_initialize_upto and PE_create_console all rebooted the phone. The probe after PE_init_printf, the next call, did not (one run), and the official image stayed on the bands with no kernel text and no panic screen. The cause was PE_create_console's access to the Raspberry Pi panic log address (see memory): with CONFIG_XNU_DT_PANIC_REGION and no other kernel change (e901139) the boot reaches bsd_init. Why the probe after PE_create_console still reset is not explained; an asynchronous fault would fit.", "On e901139 the boot CPU runs arm_init to machine_startup and on to bsd_init. Kernel threads, IOSleep, IOMalloc and IODeviceMemory mappings work: the touch probe uses them, and its panic frames are touchThread and Call_continuation. Only the boot CPU runs: sheng-smp is not set, so ArmCpu does not start the other seven cores.", "With the PMGR bridge (484a650) the boot CPU keeps running past bsd_init: image p1-pmgr ends in the root device wait, and in p3-poll the touch thread's sleeps and SPI transfers ran 3531 times before the tap.", "Two community fuxi kernels get past this point on the same SoC with the same dram-size and window size: mouse233 (iPadOS 17.7.11, own firmware with a USB RAM receiver) and Kerfand (iOS 16.7.16, the same payload-in-image layout). Both build the sheng kit; this board builds the template components ArmDTPlatform and ArmCpu.", "The payload's ADT (image m1-touch) has what CPU_ON needs: eight cpu nodes with reg 0x000 to 0x700 (MPIDR affinity), cpu0 running and cpu1-7 waiting, three cortex-a510 in cluster E and two cortex-a715, two cortex-a710 and one cortex-x3 in cluster P; /psci has method smc. UniXNU-sheng boots the same SoC with sheng-smp=1 armcpu-spi-ipi=1. No screen showed ArmCpu's secondary-core variables until the SMP rows of the touch report, so an image with only the arguments changed shows whether the boot survives, not which cores run.", "Device (680a818, images s2-smp and s3-selfipi): with sheng-smp=1 armcpu-spi-ipi=1 all seven secondary cores start. CPU_ON over smc returns 0 for each, each core enters initCPU with its own MPIDR, finds its redistributor and runs (step 7), the scheduler counts eight processors (processor_avail_count 8), and the probe's thread reported from core 3 and from core 4.", "Without armcpu-self-ipi=1 the kernel sends no IPI at all (s2-smp: 0 sent, 0 taken): xnu-10063 starts every core with SIGPdisabled in cpu_signal, cpu_signal_internal skips a core while it is set, and only a handled IPI clears it. With armcpu-self-ipi=1 each core sends itself one IPI from initCPU, the self-IPI XNU expects from PE_cpu_machine_init (comment in osfmk/kern/machine.c), and IPIs go through (s3-selfipi: 85 sent, every core took its own, cores 3 and 4 took 28 and 51). Cores 1 and 2 (cluster E) took no timer interrupt in either boot, and core 6 none in s3-selfipi.", "SGIs do not arrive on fuxi (2026-11-03, image h3-sgi): without armcpu-spi-ipi=1 the eight self-IPIs went out through ICC_SGI1R_EL1 and none was taken (ipi8/0), as UniXNU-sheng records for sheng, so armcpu-spi-ipi=1 is required.", "One boot of six with sheng-smp=1 (image h2-edge, by the order of the photographs) started no secondary core: CPU_ON returned 0 for all seven, none entered initCPU, and the scheduler ran on core 0 alone. armcpu-edge=1 is read only after processor_start returns, so it cannot hold a core before initCPU; the cause is unknown.", "Two more SMP boots (11db5c0, h4-hid and h5-edge) started all seven cores, so they failed to start once in nine boots. armcpu-edge=1 did not put work on cores 1 and 2 in a probe boot; with user space running (r3-ramblock) core 1 took timer interrupts and IPIs reached every core."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs are not recorded in dts/fuxi.dts beyond the SoC DTSI.", "Cores 1 and 2 have not been seen taking a timer interrupt. The SMP boots end in the probe's panic within about a minute, so longer SMP runs are not tested. In one boot of nine no secondary core reached initCPU after a successful CPU_ON."]
next_action = ["Record whether the secondary cores fail to start again; armcpu-edge=1 (h5-edge) changed nothing for cores 1 and 2. Find out whether cores 1 and 2 ever run work (board.toml passes sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 since the HID change); armcpu-edge=1 makes ArmCpu call ml_cpu_init_completed, so the Edge scheduler sets up its cluster matrix."]
evidence = [
  { kind = "device", command = "fastboot boot boot.img", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "Blue band (XNU entry, MMU off) and magenta band (before the MMU enable) appear; nothing after them" },
  { kind = "device", command = "fastboot boot of entry-probe reset images (local payloads from the run 41363175206 kernel, firmware 627fe52a)", revision = "12f9f38d63e4642d335583e159603cfcea2c3744", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41363175206", result = "Reset 6 s after the MMU enable and after arm_set_kernel_tbi, cpu_data_init, PE_init_platform and configure_misc_apple_regs in arm_init (the phone rebooted to the system each time); no reset after ml_parse_cpu_topology, processor_bootstrap, set_mmu_ttb or arm_vm_init" },
  { kind = "device", command = "fastboot boot of entry-probe reset images and of the official image (run 41372182658, AMP patch)", revision = "65c4f4e4c59f08e81b6790fe75d4c3eaaf04e794", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41372182658", result = "Reset after ml_parse_cpu_topology through PE_create_console (12 images); no reset after PE_init_printf (one run); official image: panel photograph shows the three bands and the end of the firmware log, no kernel text, no panic screen, no USB device for 5 min" },
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "The boot CPU reaches bsd_init; the touch probe's kernel thread runs and panics with its report (frames touchThread, Call_continuation)" },
  { kind = "device", command = "fastboot boot of image s1-smp (SHA-256 281e450dddc9dea5): sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "The boot survives with the secondary cores started: touch report as before (rows 1 to 3 and frames as in m1-touch), no reset in 240 s; free pages 383 below m1-touch" },
  { kind = "device", command = "fastboot boot of image s2-smp (SHA-256 6ca28d294bb2b318): sheng-smp=1 armcpu-spi-ipi=1 armcpu-diagnostics=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "680a818ff5efbd920d03dbedd87963d5c6116fbc", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 c1 b0 cpu3 av8 st7777777 f0000000 psci0,0,0,0,0,0,0 ipi0/0; timer interrupts per core 76/0/0/677/679/226/200/228, no IPI on any core" },
  { kind = "device", command = "fastboot boot of image s3-selfipi (SHA-256 ff832779a415c262): sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-panic=2", revision = "680a818ff5efbd920d03dbedd87963d5c6116fbc", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 c1 b0 cpu4 av8 st7777777 f0000000 psci0,0,0,0,0,0,0 ipi85/84; timer interrupts per core 76/0/0/2006/6/5/0/2, IPIs per core 1/1/1/28/51/1/1/1" },
  { kind = "device", command = "fastboot boot of image h2-edge (SHA-256 65d0dbc3039bec62): sheng-smp=1 armcpu-spi-ipi=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2 armcpu-edge=1", revision = "22579b483fd9f982aef8883f14932208a7953700", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run0 av1 st4444444 psci0,0,0,0,0,0,0 ipi1/1: CPU_ON succeeded for all seven cores and none entered initCPU" },
  { kind = "device", command = "fastboot boot of image h3-sgi (SHA-256 b7064ed8aff71697): sheng-smp=1 armcpu-self-ipi=1 fuxi-touch=4 fuxi-touch-hid=1 fuxi-touch-panic=2", revision = "22579b483fd9f982aef8883f14932208a7953700", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 av8 st7777777 ipi8/0, IPIs per core all 0: the self-IPIs sent as SGIs never arrived" },
  { kind = "device", command = "fastboot boot of image h5-edge (SHA-256 c2a3653351ae6384): fuxi-touch=4 fuxi-touch-hid=1 sheng-touch-hid=1 fuxi-touch-panic=2 armcpu-edge=1", revision = "11db5c00e84246681b9c9c06582d4eb31fb6ae26", reference = "evidence/2026-11-02-first-boot.md", result = "SMP run7 av8 st7777777; timer interrupts per core 73/0/0/2031/11/12/4/2: cores 1 and 2 idle; HID rep40/0" },
]

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["DRAM and reserved-memory nodes of the stock device tree; the apps SMMU at 0x15000000."]
configuration = ["dts/fuxi.dts includes sm8550.dtsi and sets model and compatible; package/SmmuBypass.h is the UniXNU-sheng pass-through stream helper the touch probe uses for stream 0xa3."]
procedure = ["Fill the memory map from the stock device tree and the firmware's memory map."]
findings = ["package/ufs/SmmuTakeover.h is part of the vendored ShengUfs driver sources (see storage); it matches this area's package/*Smmu* path by name only and brings no memory or SMMU change.", "fuxi and sheng share the touch engine's SMMU stream (0xa3).", "The kernel at 65c4f4e had no CONFIG_XNU_DT_PANIC_REGION, so PE_create_console (check_for_panic_log, xnu d8b80295 pexpert/arm/pe_init.c) mapped BCM2837's PLATFORM_PANIC_LOG_PADDR 0x3C0FC000 write-combined, read a word there and called bzero for 16 KiB, before initialize_screen (disassembly of the CI kernel). No RAM range in /proc/iomem and no node of the live device tree covers that address; the nearest nodes are the NSP interconnect at 0x320C0000 and the CDSP at 0x32300000. Three boots ran this code on 2026-11-02 (probes a2-console and b11-createcons, and the official image); after each of them the phone booted Android normally (checked after the third: boot completed, /data mounted). With CONFIG_XNU_DT_PANIC_REGION, the only kernel change, the boot reaches bsd_init (e901139), so this access stopped the earlier boots. Whether it faults, hangs or is ignored was not measured.", "At the touch probe's panic the kernel manages 0x127068 pages (4.61 GiB) with 0x125ccd free (vm_page_pages, vm_page_free_count): the 4.75 GiB window minus the kernel image and boot data.", "This unit has 12 GB and its /memory node differs from the firmware map (from an 8 GB unit): in the map 0x8B9D00000 + 2 MiB and 0x8BBD00000 up to 0x8BD300000 are conventional memory, but on this phone they are not RAM. UniXNU-sheng records a synchronous external abort from touching such a range at 0x8BB300000, so these holes differ per unit. uefi-fuxi c5793bc2 removes them from the map (see firmware). The window DarwinBoot takes (0x8C007C000 + 0x130000000) is inside the /memory node of this phone. Live data: /proc/iomem and /sys/firmware/fdt read with root on OS4.0.0.32."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The DTS memory map is the SoC default."]
next_action = ["Account for the hand-off regions XNU maps against the firmware's reservations."]
evidence = [
  { kind = "device", command = "fastboot boot of the run 41378843724 image (SHA-256 e360c41aa4057d27)", revision = "e90113974b1186120e4eb4c3f77bfb8d909934bf", reference = "evidence/2026-11-02-first-boot.md", result = "With CONFIG_XNU_DT_PANIC_REGION the kernel passes PE_create_console and reaches bsd_init; vm_page_pages 0x127068 and vm_page_free_count 0x125ccd at the panic" },
  { kind = "device", command = "fastboot boot of image m1-touch (SHA-256 be38300f17d03ca1): uefi-fuxi c5793bc2, fuxi-touch=4 fuxi-touch-panic=2", revision = "740711055534bd48f056f25d7bbc2673b1f57044", reference = "evidence/2026-11-02-first-boot.md", result = "Kernel on the corrected map: vm_page_pages 0x12705b and vm_page_free_count 0x125c40, the same as the third t4b-touch boot (old map, same arguments); no reset" },
]

[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "scripts/*ram-block*", "scripts/*virtio*", "scripts/*data-seed*", "package/NativeRamBlock.cpp", "package/*Disk.h", "package/PersistOverlay.h", "package/FuxiRamBlockStore.cpp", "package/ufs/**"]
inputs = ["UFS host of SM8550; the GPT of LUN 0 (userdata) on the device."]
configuration = ["CONFIG_XNU_NATIVE_UFS=y with the ShengUfs and VerifiedRoot components (board.toml), the component:ShengUfs kernel archive and native-ufs-root=1 in kernel_args: the catalog's ShengUfs (OddlyLabs/UniXNU fuxi branch, pin 99d8bcd, which carries the newest UFS change, the display bank TCR2 SEP fix of 2026-10-30; the upstream sheng tree moved its own pointer to af14068 on 2026-11-04, a delta of two Wi-Fi commits only) reads the SHNGROOT manifest at the start of userdata and publishes its OS and SystemOS windows read-only, as on sheng. CONFIG_XNU_VERIFIED_ROOT_PROBE=y, CONFIG_XNU_OWNER_ROOT_AUDIT=y, CONFIG_XNU_OWNER_ROOT_TRUST=y and CONFIG_XNU_VERIFIED_ROOT_ARCHIVE follow UniXNU-sheng.", "CONFIG_XNU_NATIVE_RAM_BLOCK=y: UniXNU RamBlock's NativeRamBlock (package/NativeRamBlock.cpp and its headers, unchanged copies of RamBlock 4be2d7e) built by scripts/build-fuxi-ram-block.py with the IOBlockStorageDevice addresses of scripts/fuxi_storage_abi.py; the native personality starts it, and it publishes a RAM disk from the loader as a block device. package/FuxiRamBlockStore.cpp answers its persistent-store hooks with no store."]
procedure = ["Select a UFS component after the firmware boots."]
findings = ["Build #28 (2026-11-04, run 41834879040, log artifact fuxi-build-logs-1) cleared the whole archive stage — archive-12-build-fuxi-ufs prints PASS (NativeUfsBlock 23 own slots, 11 original storage imports bound), so the Build #27 symbol-length fix and the validate() publication patch are in — and failed at the kernel link with 17 duplicate symbols, in two groups. Eleven are the original IOBlockStorageDevice aliases, defined by both libRamBlock.a's and libShengUfs.a's original-bindings.o (the same 11 imports, at the same fuxi_storage_abi.py addresses): the kernel build script's own rule for the virtio transport is one exact alias definition per original class, so scripts/build-fuxi-ufs.py no longer emits original-bindings.o and NativeUfs.o's audited imports resolve against the RAM block's aliases; the audited set is still recorded in its bindings.json. Six are the native_ufs_store_* hooks: package/FuxiRamBlockStore.cpp defined no-store stubs for them from when fuxi had no storage driver (its header says ShengUfs provides them on sheng), and the vendored driver defines the real ones, so the stubs are removed and the file stays as an empty translation unit; the driver's store mode is the sheng-data-persist boot argument, unset on this board, so it reports mode 0 and NativeRamBlock's behaviour is unchanged.", "Build #27 (2026-11-04, run 41832471725, log artifact fuxi-build-logs-1) got past the driver compile — the Build #14 timing gate works, NativeUfs.cpp now compiles with warnings only — and died in scripts/build-fuxi-ufs.py line 99 with StopIteration: the script looked the vtable and method symbols up as __ZTV15NativeUfsBlock / __ZN15… / __ZNK15…, but NativeUfsBlock is 14 characters, so its mangled names carry 14, not 15. Both lookups are corrected to 14. The same pass exposed a runtime gate no compile fix reaches: startRoot's Operations::validate() returns false unconditionally without NATIVE_VERIFIED_BLOCK, so ufsPrepareRootWindows would discard every prepared window at the Identity phase and publish nothing; the vendored copy now carries a second fuxi patch returning true in the unverified branch (OS/SystemOS distinctness is still enforced by ufsBuildRootPlan; see the first-boot decision in configuration).", "Build #14 (2026-11-04, run 41828936792, log artifact fuxi-build-logs-1) reached the driver compile and failed with exactly three errors, all in NativeUfs.cpp lines 1878-1880: timerTicks and native_ufs_read_ticks are used ungated in the read path but defined only inside the NATIVE_VERIFIED_BLOCK region — upstream compiles this driver only in that mode, so the unverified mode never compiled. The vendored copy carries one fuxi patch gating those two timing statements the same way (marked in the source); everything else in package/ufs/ stays byte-identical to UniXNU/ShengUfs af14068.", "Build #13 (2026-11-04) failed in the new archive step: the vendored sources were placed in a top-level kits/fuxi/ufs/ directory, which the build tree never sees — the tree links the device package directory as kits/<kit>, so device sources belong in package/. The sources moved, unmodified, to package/ufs/ (the script path kits/fuxi/ufs/ is unchanged, as it resolves through that link).", "Device-side UFS driver build (2026-11-04): scripts/build-fuxi-ufs.py compiles the vendored kits/fuxi/ufs/NativeUfs.cpp without -DNATIVE_VERIFIED_BLOCK (the catalog component build sets it unconditionally, and its policy data cannot be produced for fuxi yet), replaying the IOPlatformExpert compile record and binding NativeUfsBlock's IOBlockStorageDevice imports through scripts/fuxi_storage_abi.py, the same treatment as the RAM block; without the define the driver publishes each SHNGROOT manifest window after geometry checks and serves reads without per-block policy verification.", "Owner decision (2026-11-04): the first UFS boot runs without the owner-root trust chain (see configuration) — Build #11 failed on its missing probe archive — so first-boot root acceptance is the SHNGROOT manifest verification in the driver alone; porting the owner-policy pipeline is a separate later step.", "CI Build #10 (2026-11-04, native-ufs-root @ bdb1410) failed in Build kernel: the owner-root trust guard rejected the configuration because neither a virtio block nor a source-storage binding was enabled; the fix adds the VirtioMmioBlock component and CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y (see configuration). Build #9 was cancelled by the newer push, so no UFS kernel artifact exists yet.", "Other fuxi ports report the UFS controller hand-off from the firmware as usable; not reproduced here.", "RAM root paths (2026-11-03): handed over as md0 (rd=md0), a RAM disk is a BSD device without IOMedia, so nothing loads APFS, and mockfs, which the OS fragment enables and which accepts any device, is asked before any kext filesystem (devfs, nullfs, bindfs, mockfs and routefs come first in xnu-10063's list). Through NativeRamBlock the disk is an IOMedia: APFS attaches, publishes its volumes, and the root can be chosen by volume UUID (payload.adt.root_match_volume_uuid), as sheng roots on UFS. APFS, IOStorageFamily and the HID kexts are prelinked in the fuxi kernel.", "UniXNU binds NativeRamBlock through build/storage-abi/interface-audit.json, which needs a research candidate kernel and a gdb observation that CI does not have. IOBlockStorageDevice sits at the addresses UniXNU's marble-milacy port records: vtable 0xfffffff005cb44c0 (address point +16, 190 slots, 14 pure), metaclass 0xfffffff006add1d0, constructor 0xfffffff00496ed98, D2 0xfffffff00496edb8, with D1 and D0 brk traps; the prelinker bound the family to this kernel's IOService constructor and destructor.", "Device (22579b4, image r2-ramblock): the restore ramdisk mounts as root through NativeRamBlock. DarwinBoot hands over the packed disk, APFS attaches to the whole disk, IOFindBSDRoot finds the volume by UUID and vfs_mountroot mounts it; the managed pages drop by the disk's 129.6 MiB. bsd_init then panics with rootvp not authenticated after mounting: a non-macOS boot requires a sealed root unless bsd_rooted_ramdisk(), which tests the rd boot argument for the prefix md0. rd=md0-ramblock marks the RAM-disk root and leaves IOFindBSDRoot on the UUID match (its md path needs exactly three characters).", "User space from the restore ramdisk (11db5c0, image r3-ramblock): with rd=md0-ramblock bsd_init skips the sealed-root check, and launchd (pid 1), restored_external (pid 3) and mount_tmpfs (pid 4) run from the ramdisk's APFS volume on /dev/disk1s1, trusted by the restore trust cache. The full OS (OS and SystemOS images, about 7.9 GiB) does not fit a fastboot payload; it needs another delivery, a USB receiver in the firmware (as mouse233's port has) or a UFS driver.", "Full-OS delivery decided (2026-11-04): the native UFS root. The firmware USB-receiver route (mouse233's receiver stack transplanted into this board's firmware, through his DWC3 driver and his production build defines) reproduced his stack faithfully on the owner's unit — the SMMU route installed with his own recorded values (bank 5, CBAR 000100FF, SCTLR 000000E0) and the device enumerated fully on the host — but the link would not stay up (link state flapping in his sampler, repeated bus resets clearing every session), the same wall his notes at that revision end at; the missing layer is the platform base under the USB stack (the eUSB2 repeater, regulators and reference clock are ABL-inherited state the firmware does not drive), not the transplanted files. The owner stopped the RAM route.", "Host (2026-11-04): the userdata geometry is GPT-verified from the official HyperOS OS3.0.308.0.WMCCNXM fastboot ROM (gpt_main0.bin: userdata is the last LUN 0 partition, first LBA 3110976 = 0x2F7840; its last field is the Qualcomm grow sentinel, so the span is the unit's own getvar size 0x3804BBB sectors and the last LBA is 61850618 = 0x3AFC3FA). scripts/build-userdata-root-image.py (fuxi port of UniXNU-sheng's builder pair, reading the decoded image files directly instead of hdiutil) built the root image and the whole-partition Android sparse image; the manifest parses back under the ShengUfs RootLayout.h rules and both window hashes match the recorded IPSW extraction. Nothing has been flashed.", "Device chain (2026-11-05): the userdata image was flashed and probe=11 read it back on the unit (manifest status 0, windows 2, both window SHA-256 prefixes equal to the build manifest), but the plain boot never mounted the UFS root. Root cause by source inspection: prepare() zeroes gPendingUuid and only the NATIVE_VERIFIED_BLOCK branch of validate() fills it (signedVolumeUuid), so in this board's unverified build the publisher's per-window media wait (mediaWithUuidExists) matched IOMedia on an empty UUID string and could never succeed; RootPublication.h publishes SystemOS first and discards later windows when a wait fails, so the OS window never started and the kernel's root-matching (see configuration) waited in vain. Third fuxi patch in NativeUfs.cpp: with an empty UUID the wait falls back to ancestry alone - any IOMedia whose ancestor chain reaches the window counts as its published media; verified builds always fill the UUID and are unchanged. scripts/build-fuxi-ufs.py's docstring records all three patches.", "Owner-root chain in the driver build (2026-11-05): scripts/build-fuxi-ufs.py now compiles the vendored NativeUfs.cpp with -DNATIVE_VERIFIED_BLOCK=1 and -DNATIVE_VERIFIED_BLOCK_MULTI_POLICY=1 and the VerifiedRoot include, mirroring UniXNU's build-arm-driver.py for this component, and also compiles package/SourceRootBinding.cpp (the board root binding, from UniXNU-sheng, BSD-2-Clause-Patent) into libShengUfs.a; its native_verified_block_root_authorized is what bsd_init consults after the pubfix2 panic. In verified mode validate() fills the publication UUIDs from the signed policies (signedVolumeUuid), so the media wait matches on the real UUID; the third fuxi patch's ancestry fallback remains for the unverified branch only. scripts/build-fuxi-owner-root.py runs first in the archive order: it extracts the two IPSW volume members into the firmware cache over HTTP range requests (digests asserted), signs both policies with a per-build owner keypair (the OS policy by UniXNU's build-owner-os-policy.py over the hdiutil-attached volume; the SystemOS policy by kits/VerifiedRoot/tools/manifest.py over the raw image, with the same full C verification), and runs build-verified-root-probe.py to compile the bundle the defconfig archive points at. The policies are the full form (hash tables in the kernel, about 73 MB for both volumes), so the flashed version-1 root image needs no '.vroot' objects. Generation was proven on the host before the first CI run: both policies were signed over the pinned extractions and every block of both images verified against them with the kit's C implementation (OS 1483785 blocks, SystemOS 806400).", "Build #35 (2026-11-05, ec981af2) was the pipeline's first CI run: the range-request extraction, the keypair and host library, the hdiutil attach and UniXNU's OS policy script all passed in the runner (its own PASS line: every 1483785 OS block verified by real C/RSA), and the mirrored SystemOS verification passed (806400 blocks); the run failed only at the last step, build-verified-root-probe.py, whose replay of the bsd_init compile record names header-export staging directories under build/xnu/ios-obj/EXPORT_HDRS that the bootstrap pass - which stops at its link - never created (EXPORT_HDRS/libsa), and its -Werror makes the missing directory fatal although none of the three probe sources include anything from it. scripts/build-fuxi-owner-root.py now creates the record's missing staging directories before invoking the probe builder.", "Build #36 (2026-11-05, 24ca111d) cleared archive-01 - the staging-directory fix worked and the bundle compiled ('PASS: owner-root policies signed and bundle compiled') - and Device documentation went green again (its base now carries a valid record). The build then failed at archive-14, the upstream build-virtio-mmio-bindings.py step copied from sheng's wiring: it reads build/storage-abi/interface-audit.json, a maintainer research record produced from a prelink candidate and live debugger metadata, which no build step creates and a fresh CI tree cannot have. The fuxi line's own answer to the same problem already existed for the RAM block: scripts/build-fuxi-virtio-bindings.py now binds NativeVirtioBlock from the recorded ABI data in scripts/fuxi_storage_abi.py, exactly like build-fuxi-ram-block.py, and writes bindings.json in the shape the baseline's dual-transport check consumes.", "Build #37 (2026-11-05, 61dd82fb) cleared archive-14 - the new fuxi virtio bindings passed (PASS: NativeVirtioBlock 25 own slots, 11 original storage imports bound) - then failed at archive-15, the first NativeUfs compile: kits/fuxi/ufs/NativeUfs.cpp:18 'VerifiedBlockPolicy.h' file not found. The header lives only in UniXNU drivers/VirtioMmioBlock/, and scripts/build-fuxi-ufs.py passed only kits/VerifiedRoot/include for the verified build; upstream scripts/build-arm-driver.py's NativeUfs recipe adds both includes, so the fuxi script now adds -I drivers/VirtioMmioBlock beside the VerifiedRoot include. Earlier unverified builds never hit this because the include is guarded by NATIVE_VERIFIED_BLOCK.", "Build #38 (2026-11-05, 449c1a2): archives 14, 15 and 16 all passed - the fuxi virtio bindings (25 own slots, 11 imports), the verified UFS archive with the root binding (23 own slots, 11 imports; the drivers/VirtioMmioBlock include fixed the VerifiedBlockPolicy.h failure of Build #37) and the touch archive - and Device documentation was green. The kernel stage then failed in the baseline's own dual-transport reconciliation: it addresses each transport's object by its archive's stem (libVirtioMmioBlock.a -> VirtioMmioBlock.o, libRamBlock.a -> RamBlock.o) and hashes it against bindings.json's compiled_object_sha256, but both fuxi binding scripts wrote only the Native*.o objects, and the RAM block report lacked the hash key. Both scripts now also leave a byte-identical stem-named copy of the compiled object, and build-fuxi-ram-block.py's report carries compiled_object_sha256.", "Build #39 (2026-11-05, a16027c2) reached the kernel link itself: every archive passed, the dual-transport reconciliation accepted both bindings, and the link failed on exactly one undefined symbol, _boot_progress_poll, referenced from NativeUfs.o's verified read path (ufsReadWindow). In verified mode the driver polls the boot-progress hook while reading; this board had the option off, so no archive defined it. CONFIG_XNU_BOOT_PROGRESS=y (see configuration) makes the baseline build and force-load libBootProgress.a.", "Build #41 (2026-11-05, 23498668) was the trust chain's first fully green build (kernel SHA-256 12aef95d02ca684f977ed8f7360c24e87335e0e0edae41b9579c87df126296ff), after Build #40 exposed a script the baseline invokes but this tree never carried (scripts/build-boot-progress.py, added as a fuxi script compiling weak no-op definitions of the boot-progress entry points). Device (chain41, boot-only, locally assembled with the phone's own chip id): the UFS root mounted, FSIOC_KERNEL_ROOTAUTH passed through the owner escape hatch, and /sbin/launchd was exec'd from the System volume - the trust chain's target gate is down. launchd was then killed by the exec security policy (OS_REASON_EXEC, EXEC_EXIT_REASON_SECURITY_POLICY): the payload carried no trust cache at all (payload.json trust_cache_sha256 was null), so AMFI had no CDHash for the full-system launchd.", "Scratch Data seed built in the image job (2026-11-05): scripts/build-fuxi-data-seed.py attaches the extracted OS image (044-76040-038.dmg, digest-pinned as in scripts/build-fuxi-owner-root.py) read-only, formats a 256 MiB APFS container (volume OwnerData) with hdiutil, copies the System volume's initial private/var tree into it by UniXNU's prepare-owner-data-fixture.py recipe (staged_system_apps excluded, symlinks and modes preserved, keybags, mobile/tmp, tmp and run added, tmp 1777) and rewrites the volume UUID to the pinned 18AB5557-DC2D-469B-8758-855E60F5B0DF. A freshly formatted volume's UUID is random and no macOS tool sets it at creation, so the script replaces every raw occurrence of the created UUID - measured on this IPSW's SystemOS image, whose volume UUID occurs exactly five times, all in APFS volume-superblock checkpoint blocks at in-block offset 240 - and repairs each touched block's Fletcher-64 object checksum, restoring both invariants measured on genuine APFS objects (the full block's first Fletcher sum is zero; the stored high half equals the second sum with the checksum field zeroed). The patcher refuses any occurrence outside a volume-superblock block, and the patched seed is accepted only when a re-attach makes diskutil report the pinned VolumeUUID. Selection on the kernel side needs no verified-root change: package/NativeRamBlock.cpp's native_ram_block_volume_seed matches the unique IOMedia whose UUID property equals the pinned value and whose provider chain contains the RAM block, and the mount itself is a plain writable APFS mount at /private/var - the seed is guest-mutable and unsigned by design (upstream's checkpoints record initial_seed_signature_verified=false for the same construction). Acceptance state for the device boot: native_owner_data_stage==4 with status==0 and readonly==0, the state upstream's check-native-ram-data-checkpoints.py qualifies. The persistent store stays off (package/FuxiRamBlockStore.cpp answers the store hooks with no store and the board's store mode is 0), so the volume is per-boot ephemeral."]
