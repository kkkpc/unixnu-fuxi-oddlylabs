schema_version = 2

# Board description of the Xiaomi 13 (fuxi, SM8550), read by the unixnu build driver. Created from UniXNU
# examples/device; the hardware values come from the stock device tree and Android measurements (fuxi_touch_panel_porting.md,
# facts/). Other fuxi ports (mouse233, Kerfand, hanzi123-bilp) are references only.

[board]
name = "fuxi"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi 13"
kit = "fuxi"

# The userdata partition on LUN 0 (4096-byte LBAs), where the ShengUfs root image lives.
# GPT-verified 2026-11-04 against the official fastboot ROM OS3.0.308.0.WMCCNXM's
# gpt_main0.bin: userdata is the last partition (index 31), first LBA 3110976 (0x2F7840);
# its GPT entry carries the Qualcomm grow sentinel (last = first - 1), so the end comes
# from the owner's unit itself: fastboot getvar partition-size:userdata = 0x3804BBB
# sectors (2026-11-01), giving last = 3110976 + 0x3804BBB - 1 = 61850618 (0x3AFC3FA).
# (Earlier prep notes rendered the two hex values as wrong decimals 3112544 / 61845754;
# the hex span was always the consistent one. Values below are the verified decimals.)
[userdata]
first_lba = 3110976
last_lba = 61850618
lba_bytes = 4096

[components]
# The template set, plus the GENI SPI engine and the FTM5 protocol of the touch controller.
# The native UFS root driver is not a selected component: the catalog ShengUfs build
# compiles NativeUfs.cpp unconditionally with the verified-block define, and the driver
# is vendored in package/ufs/ and built by scripts/build-fuxi-ufs.py with that same
# define (owner decision 2026-11-05: the full owner-root trust chain is ported; its
# policies are generated inside the build by scripts/build-fuxi-owner-root.py).
# VirtioMmioBlock is selected because the kernel build's owner-root guard requires it
# and the ShengUfs component declares it as a dependency; no virtio-mmio device exists
# in this board's device tree, so the driver never matches hardware here. VerifiedRoot
# is the kit that supplies the policy machinery (kits/VerifiedRoot).
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "QcomGeniSpi", "FuxiFtsTouch", "VirtioMmioBlock", "VerifiedRoot", "GopFramebuffer", "Adreno740", "AdrenoMetal"]

[kernel]
defconfig = "fuxi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The archives the merged configuration links, in build order: corecrypto from source (plain and namespaced), the ARM
# platform and CPU drivers, SoftwareAES with its bindings (the arch fragment sets CONFIG_XNU_NATIVE_AES), libpthread, the
# mockfs fixture (the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS), the PMGR bridge (CONFIG_XNU_SHENG_PMGR: AMFI needs an
# ApplePMGRNub service), ShengHidInput's touch digitizer (force-loaded by fuxi_defconfig; the touch probe starts it), the RAM
# block (CONFIG_XNU_NATIVE_RAM_BLOCK: a RAM disk from the loader as a block device), and the touch archive that bsd_init
# calls into (patches/xnu/fuxi-touch-probe.patch). The order follows UniXNU-sheng, with two fuxi placements: the
# owner-root policy generation runs first so a policy failure stops the build before any compiling (it produces the
# probe archive the kernel link force-loads under CONFIG_XNU_VERIFIED_ROOT_PROBE), and the virtio block component
# with its bindings generator sits next to the RAM block it was audited against (Build #12).
archives = [
  "build-fuxi-owner-root.py",
  "build-fuxi-gpu-headers.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
  "build-fuxi-platform-power.py",
  "build-fuxi-hid-input.py",
  "build-fuxi-ram-block.py",
  "component:VirtioMmioBlock",
  "build-fuxi-virtio-bindings.py",
  "build-fuxi-ufs.py",
  "build-fuxi-touch.py",
  "build-fuxi-usb-debug.py",
  "stage-prelink-candidate.py",
  "seed-mobile-graphics-legacy-audit.py",
  "audit-mobile-graphics-legacy.py",
  "build-fuxi-display.py",
  "prepare-fuxi-gmu.py --dtb ../../../../../../uefi-fuxi/Platforms/Xiaomi/fuxiPkg/FdtBlob/sm8550-xiaomi-fuxi.dtb",
  "prepare-fuxi-gmu-votes.py --dtb ../../../../../../uefi-fuxi/Platforms/Xiaomi/fuxiPkg/FdtBlob/sm8550-xiaomi-fuxi.dtb",
  "prepare-fuxi-command-db-oracle.py",
  "component:Adreno740",
  "build-adreno740-kits.py",
  "build-adreno740-accelerator.py",
]

[device_tree]
source = "device:dts/fuxi.dts"
include_dirs = ["soc:dts"]

[firmware]
# OddlyLabs/uefi-fuxi, branch fuxi: UniXNU/uefi-sheng (the official Mu-Silicium fork for UniXNU) with the fuxi bring-up
# commits of matejkoo217/uefi-fuxi, whose platform package derives from Silicium's SM8550 nuwa (Xiaomi 13 Pro). The
# layout and lists follow UniXNU-sheng's [firmware]; Resources/Configs/fuxi.toml supplies the firmware base and size.
config = "fuxi"
dsc = "Platforms/Xiaomi/fuxiPkg/fuxi.dsc"
fd = "Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu",
            "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
            "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "fuxi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "fuxi-research"

# The boot image for `fastboot boot` (nothing is written to the device). Measured on hardware in matejkoo217/uefi-fuxi:
# the fuxi ABL's fastboot boot refuses a header v4 image ("Failed to load/authenticate boot image: Invalid Parameter"), so
# this is the v0 container of Resources/Configs/fuxi-legacy.toml; the ABL refuses an ARM64 header that asks for the
# firmware address ("Load Error"), so the shim advertises text offset 0; and the ABL keeps the boot image ramdisk in
# vendor_boot, so the payload rides after the firmware volume, where fuxiPkg's FuxiBootMemoryDxe publishes it.
# No [[bootimg.dtb_node]]: the firmware's FdtBlob already carries /reserved-memory/splash_region.
[bootimg]
payload = "image"

[bootimg.image]
header_version = 0
base = 0x00000000
kernel_offset = 0x00008000
tags_offset = 0x01e00000
pagesize = 4096
text_offset = 0

[payload]
volume = "FUXIESP"
# The payload volume holds the Data seed as a packed DBRDISK1 file (Payloads/scratch-data.img,
# about 1 MiB for the 256 MiB logical seed; see [payload.adt] packed_data_ramdisk), the kernel,
# the trust bundle and the ADT: about 127 MiB in total, so 192 MiB - the pre-Data size - is
# ample (UniXNU scripts/unixnu/payload.py rejects anything over 95% of size_mib). The dense
# seed at size_mib 512 (Builds #52-#59) is device-disproven: chain47/48/49 and the disc1
# discriminator all booted to a pure black screen with the dense seed in the payload, while
# chain50 with the packed seed at 192 MiB booted normally (2026-11-06). The volume is
# gzip-compressed into the boot image, so the image grows only by the payload's real content.
size_mib = 192
loader = "firmware"
title = "UniXNU"
panic_screen = true
# The payload trust cache must be upstream's two-module original bundle (StaticTrustCache +
# Cryptex1,SystemTrustCache); payload.py rejects any other bundle. scripts/build-fuxi-system-trust.py
# builds it in CI and verifies the same digest before bundling.
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]
# -v, serial=3, debug=0x14e and kt_fixed_zones=120 as on UniXNU-sheng and the other SM8550 ports. sheng-pmgr=2 publishes
# the original ApplePMGRNub that AMFI waits for (kits/fuxi/ShengPlatformPower.cpp, as UniXNU-sheng); without it AMFI panics
# with "AMFI: No PMGR?" a few seconds into bsd_init. sheng-smp=1 and armcpu-spi-ipi=1 start the seven secondary cores as on
# UniXNU-sheng, and armcpu-self-ipi=1 lets each of them take IPIs: XNU signals a core only after it has handled one IPI
# (evidence/2026-11-02-first-boot.md). fuxi-touch=4 runs the touch probe up to sensing with the interrupt, fuxi-touch-hid=1
# starts the HID device that turns its contacts into reports (kits/fuxi/FuxiHidProbe.cpp; sheng-touch-hid=1 gives that device
# its digitizer collection). The diagnostic panic is disabled on the lockscreen path; reports remain in the serial/USB log.
# Without a touch the boot ends in the root device wait.
# native-fuxi-ufs-root=1 selects the ShengUfs root in the userdata reserve (the full OS, flashed
# once) over the RAM-disk root; the touch probe's SYS row then reports the UFS root.
# sheng-data-persist=2 opens the NativeRamBlock persistent store read-write. Build #143
# proved the prior 213 GiB seed/store pair invalid on-device (header mismatch followed by
# repeated kIOReturnNotReady and APFS checksum failure). The same-device V2 path uses a
# much smaller Data fixture. Build #146 completed the one-time 16 GiB transition on device:
# OwnerData mounted and the persistent overlay wrote with er=0. The next image therefore
# omits sheng-data-reset=1 and reuses the exact #146 seed bytes so the store identity resumes.
# The driver's log reserve default remains 1024 MiB, matching the phase-A grow
# arithmetic.  Do not spend command-line bytes repeating that default.  The
# payload has a hard 1000-byte command-line limit, so settled one-shot probes
# and redundant setup/USB-control toggles stay out of the production profile.
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "sheng-pmgr=2", "sheng-smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1",
               "fuxi-touch-stage=4", "fuxi-touch=4", "fuxi-touch-hw=7", "fuxi-touch-hid=1", "sheng-touch-hid=1", "native-fuxi-ufs-root=1", "sheng-data-persist=2", "sheng-dpu=3", "sheng-cpufreq=4", "sheng-backlight=1", "fuxi-backlight=dsi", "sheng-disable-watchdogd=1", "offline-key-events=1",
               "-apfs_shared_datavolume", "-no_slto_panic", "offline-legacy-phase=4", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-pm=1", "offline-legacy-validate=1",
               "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-unit-scale=3", "sheng-vsync=120", "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-apfs-load=1", "sheng-gpu-power=9",
               "sheng-gpu-zap=4", "fuxi-cp-protect=0", "sheng-gpu-metal=1", "sheng-gpu-wc=0", "sheng-tu-debug=sysmem", "sheng-gpu-dcvs=1", "sheng-fb-gpu=1",
               "sheng-gpu-addon=1", "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd,com.apple.liveactivitiesd", "qcom-usb-debug=1"]

[payload.adt]
# Deliver the Data seed packed (DBRDISK1): DarwinBoot copies only the nonzero extents
# (about 1 MiB) instead of the whole 256 MiB dense image. Device-measured on alioth and,
# since chain50 (2026-11-06), on this unit; the dense form does not boot here (see [payload]).
packed_data_ramdisk = true
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
# Memory DarwinBoot gives XNU, as mouse233's fuxi RAM-root port uses it (verified there on this phone model).
owned_memory_size = "0x130000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
